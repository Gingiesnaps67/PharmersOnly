 opts:["More frequent glucose checks for hypoglycemia","Daily weights for fluid retention","Visual acuity checks","Monitoring for red-orange urine"],key:0,
 rat:"MAOIs have an additive hypoglycemic effect with insulin and sulfonylureas; monitor glucose and the dose may need lowering.",
 why:{1:"Fluid retention is not the interaction here; the risk is added hypoglycemia.",2:"Vision changes are not the expected interaction between an MAOI and a sulfonylurea.",3:"Red-orange urine is a rifampin/phenazopyridine effect, not an MAOI effect."},src:["PSY","MAOI drug interactions"],obj:"Apply MAOI–antidiabetic interaction.",short:"MAOI + sulfonylurea/insulin → watch for lows."},

/* ── PSYCH ── */
{id:"p1",sys:["psych"],fmt:"sata",d:2,drug:"lithium",concept:"lithium-sodium",
 stem:"A client on lithium for 2 years comes to clinic. Which findings increase the risk of toxicity? Select all that apply.",
 opts:["Takes ibuprofen three times daily for knee pain","Started a low-sodium diet","Works outdoors during a heat wave","Has had diarrhea for 2 days","Drinks 10 glasses of water daily","Recently started furosemide"],key:[0,1,2,3,5],
 rat:"NSAIDs and diuretics raise lithium levels. Low sodium, sweating and diarrhea deplete sodium, increasing lithium toxicity. Adequate fluids are protective.",
 why:{4:"Adequate fluid intake is recommended."},src:["PSY","Lithium interactions"],obj:"Identify lithium toxicity risks.",short:"Salt down, lithium up. NSAIDs and diuretics push lithium up."},
{id:"p2",sys:["psych"],fmt:"mc",d:3,drug:"haloperidol",concept:"nms",
 stem:"Day 4 of IM haloperidol: T 103.6°F, HR 122, BP swings 170/98 to 128/70, heavy sweating, rigid limbs, responds only to loud voice. Benztropine PRN is ordered for EPS. What is the priority action?",
 opts:["Hold the haloperidol and report the findings immediately","Give PRN benztropine for the rigidity","Apply a cooling blanket and recheck temperature in 1 hour","Encourage fluids and reassess at end of shift"],key:0,
 rat:"Fever, severe rigidity, autonomic instability and altered LOC early in antipsychotic therapy = neuroleptic malignant syndrome, which is potentially fatal and needs provider-directed treatment (dantrolene, bromocriptine/amantadine, cooling).",
 why:{1:"Benztropine treats EPS, not NMS.",2:"Cooling is part of treatment but alone delays medical care.",3:"NMS progresses over 24–72 h."},
 src:["PSY","Neuroleptic malignant syndrome"],obj:"Recognize NMS and escalate.",short:"Fever + rigidity + unstable vitals on antipsychotic = NMS. Stop, report."},
{id:"p3",sys:["psych"],fmt:"mc",d:2,drug:"phenelzine",concept:"maoi-tyramine",
 stem:"A client taking tranylcypromine asks which lunch is safest. Which choice should the nurse recommend?",
 opts:["Fresh grilled chicken, rice and steamed green beans","Aged cheddar sandwich on sourdough","Salami pizza with a glass of red wine","Chicken liver pâté with crackers"],key:0,
 rat:"Aged cheese, cured meats, red wine and organ meats (liver) are high in tyramine and can trigger hypertensive crisis with MAOIs.",
 why:{1:"Aged cheese is high in tyramine and can trigger hypertensive crisis.",2:"Cured meat and red wine are both high in tyramine.",3:"Organ meats such as liver are high in tyramine."},src:["PSY","MAOIs: tyramine foods"],obj:"Apply tyramine restrictions.",short:"MAOI: fresh is fine; aged, cured, fermented is not."},
{id:"p4",sys:["psych"],fmt:"mc",d:2,drug:"clozapine",concept:"clozapine",
 stem:"A client on clozapine reports a sore throat and fever of 101°F. What should the nurse do?",
 opts:["Hold the dose and report; anticipate a CBC/ANC","Give acetaminophen and continue clozapine","Encourage warm salt-water gargles","Document as a common cold"],key:0,
 rat:"Clozapine causes agranulocytosis in 1–2% of clients; sore throat and fever may signal it. WBC monitoring is required.",
 why:{1:"Continuing clozapine ignores possible agranulocytosis; fever with sore throat must be reported first.",2:"Comfort measures delay reporting a possible sign of agranulocytosis.",3:"On clozapine, sore throat and fever are never assumed to be a cold."},src:["PSY","Atypical antipsychotics: clozapine"],obj:"Recognize agranulocytosis risk.",short:"Clozapine + sore throat = check WBC."},
{id:"p5",sys:["psych"],fmt:"sata",d:3,drug:"fluoxetine",concept:"serotonin",
 stem:"A client on sertraline recently added tramadol. Which findings suggest serotonin syndrome? Select all that apply.",
 opts:["Agitation and confusion","Temperature 102.2°F","Hyperreflexia and tremor","Dilated pupils and diaphoresis","Lead-pipe rigidity developing over days with low HR","Tachycardia"],key:[0,1,2,3,5],
 rat:"Serotonin syndrome: altered mental status, autonomic dysfunction (hyperthermia, tachycardia, BP swings, mydriasis, diaphoresis) and neuromuscular abnormalities (hyperreflexia, tremor, akathisia).",
 why:{4:"Lead-pipe rigidity is more typical of NMS, and the low HR doesn't fit."},
 src:["PSY","Serotonin syndrome"],obj:"Differentiate serotonin syndrome from NMS.",short:"Serotonin syndrome = jittery, hyperreflexic, hot. NMS = rigid, hot, slow onset."},
{id:"p6",sys:["psych"],fmt:"mc",d:2,drug:"benztropine",concept:"eps-td",
 stem:"A client on long-term haloperidol has lip-smacking and tongue thrusting that started after a dose reduction. Which order should the nurse question?",
 opts:["Increase benztropine to treat the movements","Complete an AIMS assessment","Notify the provider of the findings","Document the movements in detail"],key:0,
 rat:"These are tardive dyskinesia signs. Your source states TD worsens with anticholinergic agents such as benztropine; those doses are reduced or switched.",
 why:{1:"An AIMS assessment is appropriate for suspected tardive dyskinesia.",2:"Reporting new involuntary movements is appropriate.",3:"Detailed documentation is appropriate."},src:["PSY","Tardive dyskinesia"],obj:"Distinguish EPS treatment from TD management.",short:"Benztropine helps EPS but worsens TD."},
{id:"p7",sys:["psych"],fmt:"mc",d:2,drug:"lithium",concept:"lithium-level",
 stem:"When should blood be drawn for a lithium level?",
 opts:["About 12 hours after the last dose","Immediately after a dose","Any time; timing doesn't matter","30 minutes before lunch"],key:0,
 rat:"Lithium levels are drawn about 12 hours after the last dose for a reliable trough.",why:{1:"Right after a dose gives a falsely high peak, not a trough.",2:"Timing matters; levels are drawn about 12 hours after the last dose.",3:"A pre-meal time is not tied to the last lithium dose."},src:["PSY","Lithium monitoring"],obj:"Time therapeutic drug monitoring.",short:"Lithium level: 12 h post dose."},

/* ── NEURO ── */
{id:"n1",sys:["neuro"],fmt:"mc",d:1,drug:"phenytoin",concept:"phenytoin",
 stem:"A client's phenytoin level is 26 mcg/mL. Which finding would the nurse expect?",
 opts:["Nystagmus and lethargy","Gingival bleeding only","Orange urine","Bradycardia with hazy vision"],key:0,
 rat:"Above the 10–20 mcg/mL range; toxicity signs include nystagmus, sedation and lethargy.",
 why:{1:"Gingival hyperplasia is a long-term effect, not a toxicity sign.",2:"Not related.",3:"Digoxin toxicity."},
 src:["NEU","Antiepileptics table; hydantoin interactions (NEUW)"],obj:"Recognize phenytoin toxicity.",short:"Phenytoin >20 → nystagmus, sedation."},
{id:"n2",sys:["neuro"],fmt:"sata",d:2,drug:"phenytoin",concept:"phenytoin",
 stem:"Which teaching points apply to a client starting phenytoin? Select all that apply.",
 opts:["Brush, floss and massage gums daily; keep dental visits","Report any rash immediately","Use a backup birth-control method","Take an antacid with each dose to prevent upset stomach","Take at the same times each day","Stop if you feel drowsy the first week"],key:[0,1,2,4],
 rat:"Gingival hyperplasia is reduced with oral hygiene; rash is reported and doses withheld; phenytoin reduces estrogen contraceptive effect; consistent timing keeps levels steady. Antacids decrease phenytoin effect; never stop abruptly.",
 why:{3:"Antacids decrease phenytoin's effect.",5:"Never stop antiepileptics abruptly."},
 src:["NEU","Antiepileptic patient education; NEUW interactions"],obj:"Teach phenytoin safety.",short:"Phenytoin: gums, rash, backup BC, same time daily."},
{id:"n3",sys:["neuro"],fmt:"mc",d:2,drug:"donepezil",concept:"donepezil",
 stem:"Before giving donepezil, which assessment is most important?",
 opts:["Heart rate","Serum potassium","Blood glucose","Urine color"],key:0,
 rat:"Donepezil can cause bradycardia (and AF); monitor HR. It is given in the evening before bed.",
 why:{1:"Potassium is not the key check for donepezil.",2:"Glucose is not the key check for donepezil.",3:"Urine color is not affected by donepezil."},src:["NEUW","Neuro medications table: donepezil"],obj:"Prioritize donepezil assessment.",short:"Donepezil → check HR."},
{id:"n4",sys:["neuro"],fmt:"mc",d:2,drug:"carbidopa",concept:"pd-meds",
 stem:"A client with Parkinson disease on carbidopa-levodopa reports dizziness when getting out of bed. Which instruction is best?",
 opts:["Sit on the edge of the bed for a few minutes before standing","Skip the morning dose","Increase protein at breakfast","Stand up quickly to get blood flowing"],key:0,
 rat:"Orthostatic hypotension is common; rise slowly. High-protein meals can reduce levodopa effect.",
 why:{1:"Skipping doses worsens Parkinson symptoms; don't change dosing on your own.",2:"High-protein meals can reduce levodopa effect.",3:"Standing quickly worsens orthostatic hypotension and risks a fall."},src:["NEUW","Parkinson medications table"],obj:"Manage carbidopa-levodopa orthostasis.",short:"Levodopa → rise slowly."},
{id:"n5",sys:["neuro","psych"],fmt:"mc",d:2,drug:"lorazepam",concept:"status-epi",
 stem:"A client's generalized seizure has lasted 6 minutes. Which drug class does the nurse anticipate first?",
 opts:["IV benzodiazepine such as lorazepam","Oral phenytoin","Levetiracetam by mouth","Carbamazepine suspension"],key:0,
 rat:"Seizure >5 min is status epilepticus: IV benzodiazepines first, followed by a long-term anticonvulsant.",
 why:{1:"Oral phenytoin is a long-term anticonvulsant, not first-line for status epilepticus; a seizing client cannot swallow safely.",2:"Oral drugs are unsafe during an active seizure and are not first-line.",3:"Carbamazepine is for long-term control, not status epilepticus."},src:["NEU","Seizure disorders: status epilepticus"],obj:"Recognize status epilepticus treatment.",short:"Seizure >5 min → IV benzo."},
{id:"n6",sys:["neuro"],fmt:"matrix",d:2,concept:"aed-monitor",
 stem:"Match each antiepileptic with the priority monitoring from your course table.",
 rows:["Phenytoin","Carbamazepine","Valproic acid","Levetiracetam"],cols:["Level 10–20 mcg/mL, gums","CBC (bone marrow suppression)","Liver function, pancreatitis signs","Few interactions; preferred for prophylaxis"],key:[0,1,2,3],
 rat:"From your Neuro antiepileptics table.",src:["NEU","Antiepileptics table"],obj:"Pair antiepileptics with monitoring.",short:"Phenytoin-level; Carbamazepine-CBC; Valproate-liver; Keppra-easy."},

/* ── MATERNAL ── */
{id:"m1",sys:["mat"],fmt:"mc",d:3,drug:"magsulfate",concept:"mag-tox",
 stem:"A client with severe preeclampsia on magnesium sulfate 2 g/h: RR 11, patellar reflexes absent, urine output 60 mL in 4 hours, drowsy. Which action is first?",
 opts:["Stop the magnesium infusion and notify the provider; prepare calcium gluconate","Recheck reflexes in 1 hour","Increase IV fluids to boost urine output","Turn the client supine for better assessment"],key:0,
 rat:"Absent reflexes, RR <16 and low output (<100 mL/4 h) are toxicity signs: withhold further magnesium and have calcium gluconate (antidote) ready.",
 why:{1:"Delays treatment of toxicity.",2:"Doesn't address toxicity and needs an order.",3:"Supine causes hypotension; side-lying is preferred."},
 src:["MAT","Magnesium sulfate adverse effects"],obj:"Recognize magnesium toxicity.",short:"Mag tox: no reflexes, RR <16, low output → stop, calcium."},
{id:"m2",sys:["mat"],fmt:"mc",d:2,drug:"oxytocin",concept:"oxytocin-decel",
 stem:"During an oxytocin induction, the monitor shows contractions every 1.5 minutes and recurrent late decelerations. What should the nurse do first?",
 opts:["Stop the oxytocin infusion","Increase the oxytocin rate","Place the client supine","Document and continue monitoring"],key:0,
 rat:"Tachysystole with late decelerations means uteroplacental insufficiency. Stop oxytocin first, then intrauterine resuscitation (side-lying, fluids, O₂ per protocol) and notify.",
 why:{1:"Increasing oxytocin worsens tachysystole and fetal compromise.",2:"Supine positioning reduces uteroplacental blood flow; side-lying is used.",3:"Late decelerations with tachysystole need action, not just documentation."},src:["MAT","Uterine stimulants: oxytocin"],obj:"Respond to oxytocin complications.",short:"Pit problem → stop the Pit."},
{id:"m3",sys:["mat"],fmt:"mc",d:2,drug:"methylergonovine",concept:"methergine-htn",
 stem:"A postpartum client with a boggy uterus has BP 158/102. Which prescription should the nurse question?",
 opts:["Methylergonovine 0.2 mg IM","Oxytocin infusion","Fundal massage","Assess lochia every 15 minutes"],key:0,
 rat:"Methylergonovine causes hypertension and is contraindicated in hypertensive or preeclamptic clients.",
 why:{1:"Oxytocin is appropriate for a boggy uterus and does not carry methylergonovine's hypertension risk.",2:"Fundal massage is appropriate for a boggy uterus.",3:"Frequent lochia assessment is appropriate."},src:["MAT","Methylergonovine"],obj:"Identify methylergonovine contraindications.",short:"Methergine + high BP = no."},
{id:"m4",sys:["mat","blood"],fmt:"mc",d:1,drug:"rhogam",concept:"rhogam",
 stem:"Which postpartum client needs Rho(D) immune globulin?",
 opts:["Rh-negative mother who delivered an Rh-positive infant","Rh-positive mother with an Rh-negative infant","Rh-positive mother with an Rh-positive infant","Rh-negative mother with an Rh-negative infant"],key:0,
 rat:"Given to Rh-negative mothers exposed to Rh-positive blood, within 72 hours.",why:{1:"An Rh-positive mother cannot form anti-Rh antibodies, so Rho(D) is not needed.",2:"An Rh-positive mother does not need Rho(D).",3:"With an Rh-negative infant there is no Rh-positive exposure."},src:["MAT","Rho(D) immune globulin"],obj:"Identify RhoGAM candidates.",short:"Negative mom, positive baby → RhoGAM within 72 h."},
{id:"m5",sys:["mat"],fmt:"bowtie",d:3,drug:"magsulfate",concept:"mag-tox",
 stem:"G1 at 36 weeks, BP 168/112, 3+ proteinuria, headache, magnesium sulfate infusing. Two hours later: RR 10, reflexes absent, says she feels 'hot all over.'",
 cond:["Magnesium toxicity","Eclamptic seizure","Placental abruption","Expected magnesium effect"],condKey:0,
 act:["Stop the magnesium infusion","Have calcium gluconate ready","Increase the infusion to prevent seizures","Place supine","Encourage ambulation"],actKey:[0,1],
 mon:["Respiratory rate","Patellar reflexes","Blood glucose","Hemoglobin A1C","Visual acuity"],monKey:[0,1],
 rat:"Low RR, absent reflexes and flushing are toxicity signs. Stop the infusion, prepare calcium gluconate, and monitor respirations and reflexes.",
 src:["MAT","Magnesium sulfate"],obj:"Link magnesium toxicity cues to actions and monitoring.",short:"Mag tox → stop + calcium; watch RR and reflexes."},
{id:"m6",sys:["mat","gi"],fmt:"mc",d:2,drug:"misoprostol",concept:"pregnancy-cx",
 stem:"Which medication order for a 24-year-old who might be pregnant should the nurse clarify first?",
 opts:["Misoprostol for NSAID ulcer prevention","Acetaminophen for headache","Famotidine for heartburn","Ferrous sulfate for anemia"],key:0,
 rat:"Misoprostol is contraindicated in pregnancy (can induce miscarriage).",why:{1:"Acetaminophen is not the order to clarify first here.",2:"Famotidine is not the order to clarify first here.",3:"Iron for anemia is not the order to clarify first here."},src:["GI","GI prostaglandin"],obj:"Spot pregnancy contraindications.",short:"Misoprostol: not in pregnancy."},

/* ── PEDS ── */
{id:"k1",sys:["peds","blood"],fmt:"mc",d:1,drug:"ferrous",concept:"iron-teach",
 stem:"Which instruction about liquid iron for a 3-year-old is correct?",
 opts:["Give it through a straw or to the back of the mouth, then brush teeth","Mix it in the child's bottle of milk","Stop the iron if stools turn black","Give it with an antacid to prevent upset stomach"],key:0,
 rat:"Liquid iron stains teeth; give with a straw and provide oral hygiene. Black stools are expected. Milk and antacids reduce absorption.",
 why:{1:"Milk reduces iron absorption.",2:"Black stools are expected with iron, not a reason to stop.",3:"Antacids reduce iron absorption."},src:["BL","Iron administration"],obj:"Teach pediatric iron administration.",short:"Iron: straw, juice, black stools OK, no antacid/milk."},
{id:"k2",sys:["peds","cardio"],fmt:"mc",d:2,drug:"digoxin",concept:"digoxin-check",
 stem:"An infant's apical pulse is 84 before a scheduled digoxin dose. What should the nurse do?",
 opts:["Withhold and report the pulse to the prescriber","Give the dose and recheck in 1 hour","Give half the dose","Count the radial pulse instead"],key:0,
 rat:"Your source: report a child's pulse <90 because the prescriber may decide to withhold. Always take the apical pulse for a full minute.",
 why:{1:"Giving the dose with a pulse under 90 in an infant ignores the reporting parameter.",2:"The nurse never changes the dose without an order.",3:"Digoxin assessment uses the apical pulse for a full minute."},src:["CV","Digoxin implementation (children)"],obj:"Apply pediatric digoxin parameters.",short:"Child digoxin: pulse <90 → report."},
{id:"k3",sys:["peds","pain"],fmt:"mc",d:2,drug:"acetaminophen",concept:"apap-dose",
 stem:"A 14-year-old who weighs 42 kg has acetaminophen ordered. Per your course file, what is the maximum single dose?",
 opts:["15 mg/kg (up to 750 mg)","1000 mg","10 mg/kg (up to 325 mg)","650 mg every 2 hours"],key:0,
 rat:"For ≥13 years and <50 kg: 15 mg/kg every 6 h (or 12.5 mg/kg every 4 h), single dose not over 15 mg/kg up to 750 mg; max 75 mg/kg up to 3750 mg/day.",
 why:{1:"1000 mg exceeds 15 mg/kg (630 mg for 42 kg) and the 750 mg cap.",2:"This is not the parameter your course file lists.",3:"Every 2 hours is too frequent; the file lists every 6 h (or 12.5 mg/kg every 4 h)."},src:["PAIN","Acetaminophen dosing"],obj:"Apply weight-based acetaminophen limits.",short:"Under 50 kg: 15 mg/kg/dose."},
{id:"k4",sys:["peds","psych"],fmt:"mc",d:2,drug:"methylphenidate",concept:"stimulant",
 stem:"A parent asks when to give their child's methylphenidate. Best response?",
 opts:["In the morning, with or after breakfast; avoid late-day doses","At bedtime to help sleep","Only on school days when behavior is bad","With a caffeinated drink to boost the effect"],key:0,
 rat:"Stimulants cause insomnia and appetite suppression; give in the morning with/after breakfast and avoid late doses. (Reference content — verify.)",
 why:{1:"Stimulants cause insomnia; bedtime doses are avoided.",2:"Doses follow the prescription, not behavior on a given day.",3:"Caffeine adds stimulant effects; it is not used to boost the drug."},src:null,obj:"Teach stimulant timing.",short:"Stimulants: mornings, monitor growth."},
{id:"k5",sys:["peds","endo"],fmt:"mc",d:2,drug:"levothyroxine",concept:"congenital-hypo",
 stem:"Parents of an infant with congenital hypothyroidism ask why daily levothyroxine matters so much. Best response?",
 opts:["\"Prompt, consistent treatment prevents permanent cognitive impairment.\"","\"It only matters until the baby can walk.\"","\"It's mostly to prevent weight gain.\"","\"Missing doses is fine if the baby seems energetic.\""],key:0,
 rat:"Prompt treatment is critical to avoid permanent cognitive impairment; noncompliance can harm intelligence.",
 why:{1:"Treatment is lifelong and is not tied to walking.",2:"The purpose is preventing permanent cognitive impairment, not weight control.",3:"Missed doses can harm intelligence even if the baby seems fine."},src:["PEDS","Hypothyroidism in children"],obj:"Explain the importance of thyroid replacement in infants.",short:"Congenital hypothyroid: treat early, every day, for life."},
{id:"k6",sys:["peds","onc"],fmt:"sata",d:2,drug:"filgrastim",concept:"neutropenia",
 stem:"A child receiving chemotherapy for ALL has an ANC of 400. Which actions are appropriate? Select all that apply.",
 opts:["Private room with neutropenic precautions","Strict hand hygiene","Monitor temperature closely","Give filgrastim subcut as prescribed","Rectal temperatures every 4 hours","Fresh flowers to cheer the child"],key:[0,1,2,3],
 rat:"Neutropenic precautions, hand hygiene, temperature monitoring and G-CSF reduce infection. Rectal routes risk mucosal injury; fresh flowers carry organisms.",
 why:{4:"Avoid rectal routes in neutropenia.",5:"Fresh flowers/plants are restricted."},
 src:["PEDS","Child with cancer: infection interventions"],obj:"Plan neutropenic care.",short:"Neutropenia: protect from germs; no rectal anything."},

/* ── REPRO ── */
{id:"g1",sys:["repro"],fmt:"sata",d:2,drug:"coc",concept:"coc-aches",
 stem:"A client using a combined hormonal contraceptive patch should report which symptoms immediately? Select all that apply.",
 opts:["Severe headache","Blurred vision","Calf pain","Shortness of breath","Mild breast tenderness the first month","Chest pain"],key:[0,1,2,3,5],
 rat:"Your Reproductive file lists severe headache, dizziness, blurred vision, leg pain, shortness of breath, chest pain and acute abdominal pain as serious effects (possible thromboembolism).",
 why:{4:"Common and usually transient."},src:["REP","Transdermal contraceptive teaching"],obj:"Teach serious contraceptive warning signs.",short:"ACHES = report."},
{id:"g2",sys:["repro"],fmt:"mc",d:2,drug:"coc",concept:"coc-risk",
 stem:"Which client is at highest risk for serious cardiovascular effects from a combined oral contraceptive?",
 opts:["38-year-old who smokes 20 cigarettes a day","22-year-old runner","30-year-old with seasonal allergies","26-year-old who drinks coffee daily"],key:0,
 rat:"Risk increases with age and heavy smoking (≥15 cigarettes/day), significant over 35.",why:{1:"Young age and no smoking mean lower risk.",2:"Seasonal allergies do not add cardiovascular risk with the pill.",3:"Coffee is not the listed risk factor; age over 35 and heavy smoking are."},src:["REP","Combined contraceptives: smoking"],obj:"Identify OC risk factors.",short:"Over 35 + smoker = estrogen danger."},
{id:"g3",sys:["repro","uri"],fmt:"mc",d:2,drug:"finasteride",concept:"finasteride",
 stem:"A client starting finasteride for BPH lives with his pregnant wife. Which teaching is essential?",
 opts:["She should not handle crushed or broken tablets","Take the tablet only at bedtime","Expect results within 3 days","He must stop if his PSA drops"],key:0,
 rat:"Finasteride absorbed through skin can harm a male fetus. Results take 6–12 months; PSA drops ~50% (expected).",
 why:{1:"Timing at bedtime is not the essential safety point.",2:"Results take 6–12 months, not 3 days.",3:"A PSA drop of about 50% is expected and is not a reason to stop."},src:["REP","Finasteride"],obj:"Teach finasteride safety.",short:"Finasteride: pregnant women don't touch crushed tablets."},
{id:"g4",sys:["repro","cardio"],fmt:"mc",d:2,drug:"sildenafil",concept:"pde5-nitrate",
 stem:"A client with angina asks about sildenafil. Which response is most important?",
 opts:["\"Taking it with nitroglycerin can drop your blood pressure dangerously; talk with your provider.\"","\"Take it anytime as often as needed.\"","\"It also increases sexual desire.\"","\"It works without sexual stimulation.\""],key:0,
 rat:"PDE-5 inhibitors with nitrates cause severe hypotension; patients with CV disease need provider approval. Not more than once per 24 h; stimulation is required; no aphrodisiac effect.",
 why:{1:"It is taken no more than once in 24 hours.",2:"It has no aphrodisiac effect.",3:"Sexual stimulation is required for it to work."},src:["REP","Phosphodiesterase inhibitors"],obj:"Recognize PDE-5 + nitrate interaction.",short:"Sildenafil + nitro = BP crash."},
{id:"g5",sys:["repro","infect"],fmt:"mc",d:2,drug:"coc",concept:"coc-interaction",
 stem:"A client taking an oral contraceptive is prescribed a 10-day antibiotic course. What should the nurse teach?",
 opts:["Use an additional form of birth control during the course","Stop the pill until the antibiotic is finished","Take the pill twice daily","No change is needed"],key:0,
 rat:"Your source: antibacterials (penicillins, tetracyclines, rifampin) can make contraceptives less effective; use backup.",
 why:{1:"Stopping the pill removes protection; continue it and add backup.",2:"Doubling the pill is not the teaching; backup contraception is.",3:"Antibacterials can make contraceptives less effective, so a change is needed."},src:["REP","Oral contraceptive interactions"],obj:"Apply OC interactions.",short:"Antibiotics + pill → backup method."},

/* ── BLOOD ── */
{id:"b1",sys:["blood"],fmt:"mc",d:2,drug:"ferrous",concept:"iron-teach",
 stem:"Which statement shows a need for more teaching about oral iron?",
 opts:["\"I'll take it with my antacid so my stomach doesn't hurt.\"","\"Orange juice helps me absorb it.\"","\"My stools may turn dark.\"","\"I'll keep it out of my grandkids' reach.\""],key:0,
 rat:"Antacids reduce iron absorption. Vitamin C enhances it; dark stools are expected; iron is toxic to children.",
 why:{1:"Correct: vitamin C enhances iron absorption.",2:"Correct: dark stools are expected.",3:"Correct: iron is toxic to children."},src:["BL","Iron administration"],obj:"Evaluate iron teaching.",short:"Iron's enemy = antacid."},
{id:"b2",sys:["blood","cardio"],fmt:"mc",d:3,drug:"enoxaparin",concept:"lmwh",
 stem:"A client receiving enoxaparin had a lumbar epidural catheter removed yesterday and now reports new leg numbness and weakness. What is the priority?",
 opts:["Report immediately — possible spinal/epidural hematoma","Reposition and recheck in 4 hours","Give the next enoxaparin dose on time","Apply warm packs to the legs"],key:0,
 rat:"Anticoagulants given after spinal/epidural procedures raise the risk of spinal hematoma, which can cause paralysis.",
 why:{1:"Waiting 4 hours risks permanent paralysis from a spinal hematoma.",2:"More anticoagulant could worsen a bleed; report first.",3:"Warm packs do not address a possible spinal hematoma."},src:["CV","Anticoagulants: spinal/epidural caution"],obj:"Recognize spinal hematoma risk.",short:"Anticoagulant + epidural + new leg weakness = emergency."},
{id:"b3",sys:["blood","onc"],fmt:"matrix",d:2,concept:"growth-factors",
 stem:"Match the drug to the blood cell line it supports.",
 rows:["Filgrastim","Epoetin alfa","Ferrous sulfate"],cols:["Neutrophils/WBCs","Red blood cells (marrow stimulation)","Hemoglobin synthesis (raw material)"],key:[0,1,2],
 rat:"Filgrastim (G-CSF) raises neutrophils; epoetin stimulates RBC production; iron provides the building block for hemoglobin.",
 src:["REP","Chemotherapy adverse effects"],obj:"Distinguish hematopoietic agents.",short:"FILgrastim-WBC, EPOetin-RBC."},
{id:"b4",sys:["blood","cardio"],fmt:"mc",d:2,drug:"heparin",concept:"anticoag-antidote",
 stem:"A client on a heparin drip has hematuria and an aPTT far above the therapeutic range. Which drug should the nurse have ready?",
 opts:["Protamine sulfate","Vitamin K","Naloxone","Calcium gluconate"],key:0,
 rat:"Protamine reverses heparin. Vitamin K reverses warfarin; naloxone reverses opioids; calcium gluconate reverses magnesium.",
 why:{1:"Vitamin K reverses warfarin, not heparin.",2:"Naloxone reverses opioids.",3:"Calcium gluconate reverses magnesium."},src:["MS","PE: heparin antagonist"],obj:"Match antidote to anticoagulant.",short:"Protamine for heParin."},
{id:"b5",sys:["blood","cardio"],fmt:"mc",d:2,drug:"apixaban",concept:"doac",
 stem:"Which statement about apixaban is accurate?",
 opts:["Routine INR monitoring is not required","It is reversed with vitamin K","It is monitored with aPTT","Leafy greens must be eaten consistently"],key:0,
 rat:"DOACs have predictable effects and don't need routine INR. (Reference content — not in your course files.)",
 why:{1:"Vitamin K is the warfarin antidote.",2:"aPTT monitors heparin.",3:"Consistent leafy greens is warfarin teaching."},src:null,obj:"Differentiate DOACs from warfarin.",short:"DOAC: no INR."},

/* ── INTEG ── */
{id:"i1",sys:["integ"],fmt:"matrix",d:2,concept:"burn-topicals",
 stem:"For each burn agent, select its key disadvantage.",
 rows:["Silver sulfadiazine","Mafenide","Silver nitrate"],cols:["Gray skin; depressed granulocytes","Painful; metabolic acidosis","Stains everything; electrolyte imbalance"],key:[0,1,2],
 rat:"From Table 43.6 in your Integumentary file.",src:["INT","Table 43.6 Topical burn medications"],obj:"Compare topical burn agents.",short:"Silvadene-gray, Mafenide-acid, Silver nitrate-stains."},
{id:"i2",sys:["integ","peds"],fmt:"sata",d:2,drug:"isotretinoin",concept:"isotretinoin",
 stem:"A 17-year-old female is starting isotretinoin. What should the plan include? Select all that apply.",
 opts:["Negative pregnancy test before starting","Two reliable forms of contraception, continued for 1 month after stopping","Screening for depression and suicidal thoughts","Lipid monitoring","Encourage tanning to dry lesions"],key:[0,1,2,3],
 rat:"Isotretinoin is absolutely contraindicated in pregnancy, can cause depression/suicidal ideation, raises cholesterol and triglycerides, and causes photosensitivity.",
 why:{4:"Photosensitivity — avoid sun/tanning."},src:["PEDS","Adolescent acne"],obj:"Plan isotretinoin safety.",short:"Isotretinoin: no pregnancy, watch mood, check lipids."},
{id:"i3",sys:["integ","infect"],fmt:"mc",d:2,drug:"amoxicillin",concept:"abx-allergy",
 stem:"A client with cellulitis develops a new itchy rash after the second dose of penicillin. What is the nurse's first action?",
 opts:["Hold the next dose and report the rash","Give diphenhydramine and continue","Apply hydrocortisone cream","Document as expected"],key:0,
 rat:"Your source: penicillin can cause severe allergic reactions that start as rashes — stop and report before it becomes anaphylaxis.",
 why:{1:"Continuing penicillin after a new rash risks progression to anaphylaxis.",2:"Cream treats the skin, not the allergic reaction; the drug must be held and reported.",3:"A new rash after penicillin is not expected; it may signal allergy."},src:["INT","Cellulitis: antibiotics"],obj:"Respond to suspected drug allergy.",short:"New rash on antibiotic → hold and report."},
{id:"i4",sys:["integ"],fmt:"mc",d:2,drug:"silversulf",concept:"burn-topicals",
 stem:"Which lab result is most important to monitor in a client with prolonged silver sulfadiazine use?",
 opts:["WBC count","Serum magnesium","PT/INR","TSH"],key:0,
 rat:"Prolonged use may depress granulocyte formation.",why:{1:"Magnesium is not affected by silver sulfadiazine.",2:"PT/INR is not the listed concern.",3:"TSH is not related to silver sulfadiazine."},src:["INT","Table 43.6"],obj:"Monitor topical burn agent effects.",short:"Silvadene → WBC."},
{id:"i5",sys:["integ","infect"],fmt:"mc",d:1,drug:"acyclovir",concept:"antiviral",
 stem:"Which medication class does the nurse anticipate for an older adult with a painful dermatomal vesicular rash (herpes zoster)?",
 opts:["Antiviral such as acyclovir","Antifungal cream","Broad-spectrum antibiotic","Topical steroid alone"],key:0,
 rat:"Shingles management includes acyclovir (oral/IV), analgesics and measures to prevent secondary infection.",why:{1:"Shingles is viral; antifungals do not treat it.",2:"Antibiotics do not treat a viral rash.",3:"A steroid alone does not treat the virus."},src:["INT","Herpes zoster management"],obj:"Match antiviral to indication.",short:"Shingles → acyclovir."},

/* ── MSK ── */
{id:"s1",sys:["msk"],fmt:"mc",d:2,drug:"alendronate",concept:"bisphos",
 stem:"Which morning routine shows correct alendronate use?",
 opts:["Swallow with a full glass of water on waking, stay upright, eat 30 minutes later","Take with coffee and breakfast","Take with milk at bedtime","Chew the tablet then lie down"],key:0,
 rat:"Bisphosphonates are taken with a full glass of water 30 minutes before food or other meds; staying upright reduces esophageal injury (reference).",
 why:{1:"Coffee and food reduce absorption.",2:"Milk reduces absorption, and lying down risks esophageal injury.",3:"Chewing and lying down risk esophageal injury."},src:["MSK","Osteoporosis drug therapy"],obj:"Teach bisphosphonate administration.",short:"Water, wait (upright), then eat."},
{id:"s2",sys:["msk"],fmt:"mc",d:2,drug:"allopurinol",concept:"gout",
 stem:"Three weeks after starting allopurinol, a client calls with a gout flare and wants to stop the drug. Best response?",
 opts:["\"Flares are common early; keep the same dose and I'll tell your provider.\"","\"Stop it and we'll find a new medicine.\"","\"Double the dose until the flare ends.\"","\"Limit fluids to concentrate the drug.\""],key:0,
 rat:"Attacks may increase during the first months; continue without changing dose. Fluids are increased.",
 why:{1:"Stopping is not needed; early flares are common.",2:"The client never changes the dose without the provider.",3:"Fluids are increased, not limited."},src:["MSK","Gout drug therapy"],obj:"Support allopurinol adherence.",short:"Allopurinol: early flares, don't quit, drink up."},
{id:"s3",sys:["msk","neuro"],fmt:"mc",d:3,drug:"dantrolene",concept:"mh",
 stem:"During surgery, a client develops rapidly rising temperature, jaw and muscle rigidity, and tachycardia after anesthesia induction. Which drug should the team prepare?",
 opts:["Dantrolene","Naloxone","Protamine","Glucagon"],key:0,
 rat:"Malignant hyperthermia — an unusual reaction to anesthetic/neuromuscular agents — is treated with dantrolene, a direct-acting muscle relaxant.",
 why:{1:"Naloxone reverses opioids, not malignant hyperthermia.",2:"Protamine reverses heparin.",3:"Glucagon treats hypoglycemia."},src:["MSK","Dantrolene uses"],obj:"Recognize malignant hyperthermia treatment.",short:"Hot + rigid after anesthesia → dantrolene."},
{id:"s4",sys:["msk"],fmt:"sata",d:2,drug:"colchicine",concept:"gout",
 stem:"Which teaching applies to colchicine for acute gout? Select all that apply.",
 opts:["Take at the first sign of a flare","Report nausea, vomiting or diarrhea","Drink 8–12 glasses of fluid daily","It lowers uric acid in the blood","Follow a low-purine diet and limit alcohol"],key:[0,1,2,4],
 rat:"Colchicine works best early; GI effects are common; fluids and low-purine diet help. It does not lower uric acid (not uricosuric).",
 why:{3:"Colchicine doesn't change uric acid levels."},src:["MSK","Colchicine; gout teaching plan"],obj:"Teach colchicine use.",short:"Colchicine: early, GI effects, doesn't lower uric acid."},
{id:"s5",sys:["msk","pain"],fmt:"mc",d:2,drug:"ibuprofen",concept:"nsaid",
 stem:"A client with chronic kidney disease and K⁺ 5.8 mEq/L takes several home medications. Which is most likely contributing?",
 opts:["Ibuprofen","Furosemide","Hydrochlorothiazide","Levothyroxine"],key:0,
 rat:"NSAIDs (and ACE inhibitors, ARBs, spironolactone, potassium supplements) raise potassium; loop and thiazide diuretics lower it.",
 why:{1:"Loop diuretics lower potassium.",2:"Thiazides lower potassium.",3:"Levothyroxine does not raise potassium."},src:["MSK","F&E course notes: hyperkalemia causes"],obj:"Identify drugs causing hyperkalemia.",short:"High-K crew: NSAIDs, prils, sartans, spironolactone, K supplements."},

/* ── GI ── */
{id:"gi1",sys:["gi"],fmt:"mc",d:2,drug:"lactulose",concept:"lactulose",
 stem:"A client with cirrhosis is confused and has asterixis. Which outcome shows lactulose is effective?",
 opts:["Improved orientation and lower ammonia level","One hard stool every 3 days","Increased abdominal girth","Weight gain of 2 kg"],key:0,
 rat:"Lactulose lowers ammonia; improved mental status is the goal.",why:{1:"Lactulose is expected to produce soft stools, not hard stools every 3 days.",2:"Increasing girth suggests worsening ascites, not lactulose success.",3:"Weight gain is not the goal of lactulose therapy."},src:["GI","Hepatic encephalopathy"],obj:"Evaluate lactulose therapy.",short:"Lactulose works → clearer head, lower ammonia."},
{id:"gi2",sys:["gi"],fmt:"matrix",d:2,concept:"gi-timing",
 stem:"Select the correct administration timing for each GI drug.",
 rows:["Omeprazole","Sucralfate","Famotidine with antacid"],cols:["30–60 min before a meal","Empty stomach before meals and at bedtime","Separate the two by at least 2 hours"],key:[0,1,2],
 rat:"PPIs before meals; sucralfate QID before meals and HS; H2 blockers and antacids separated by 2 h.",src:["GI","GI medications (Mamani Part 2)"],obj:"Time GI drugs correctly.",short:"PPI before meals; Carafate empty stomach; antacids 2 h apart."},
{id:"gi3",sys:["gi"],fmt:"sata",d:2,drug:"omeprazole",concept:"ppi",
 stem:"A client has taken omeprazole for 3 years. Which risks should the nurse monitor? Select all that apply.",
 opts:["Fractures","Low magnesium","Vitamin B12 deficiency","C. difficile diarrhea","Hyperkalemia"],key:[0,1,2,3],
 rat:"Your GI file lists fractures, hypomagnesemia, B12 deficiency, rash and C. diff as serious PPI effects.",
 why:{4:"Not a listed PPI effect."},src:["GI","PPIs"],obj:"Monitor long-term PPI therapy.",short:"Long-term PPI: bones, Mg, B12, C. diff."},
{id:"gi4",sys:["gi"],fmt:"mc",d:2,drug:"metoclopramide",concept:"eps-td",
 stem:"A client on metoclopramide develops facial grimacing and tongue movements. What should the nurse do?",
 opts:["Hold the next dose and report the movements","Give it with food","Document as expected","Increase fluids"],key:0,
 rat:"Metoclopramide can cause extrapyramidal symptoms and tardive dyskinesia.",why:{1:"Food doesn't treat drug-induced movements.",2:"New involuntary movements are not expected; they must be reported.",3:"Fluids do not treat extrapyramidal symptoms."},src:["GI","Prokinetic agents"],obj:"Recognize metoclopramide EPS.",short:"Reglan can cause EPS/TD."},
{id:"gi5",sys:["gi","onc"],fmt:"mc",d:1,drug:"ondansetron",concept:"antiemetic",
 stem:"When should ondansetron be given for chemotherapy-induced nausea?",
 opts:["Before the chemotherapy begins","Only after vomiting starts","The next morning","Mixed into the chemo bag"],key:0,
 rat:"Antiemetics prevent CINV best when given before chemotherapy (reference timing).",why:{1:"Waiting for vomiting misses prevention.",2:"The next morning is too late to prevent acute CINV.",3:"Antiemetics are never mixed into a chemotherapy bag by the nurse."},src:["REP","Chemo nausea management"],obj:"Time antiemetics.",short:"Antiemetic before chemo."},

/* ── URINARY ── */
{id:"u1",sys:["uri"],fmt:"mc",d:1,drug:"phenazopyridine",concept:"pyridium",
 stem:"A client taking phenazopyridine calls about bright orange urine. Best response?",
 opts:["\"That is expected; it's from the medicine.\"","\"Go to the ER — it may be blood.\"","\"Stop your antibiotic.\"","\"Drink less water.\""],key:0,
 rat:"Phenazopyridine turns urine bright orange; limit use to 2 days unless told otherwise; it doesn't treat infection.",
 why:{1:"Bright orange urine is the expected drug effect, not blood.",2:"Phenazopyridine doesn't treat infection; the antibiotic must continue.",3:"Fluid restriction is not indicated."},src:["URI","UTI treatment"],obj:"Teach expected phenazopyridine effects.",short:"Pyridium = orange urine; pain only."},
{id:"u2",sys:["uri"],fmt:"sata",d:2,concept:"uti-teach",
 stem:"Which UTI teaching points are correct? Select all that apply.",
 opts:["Finish all of the antibiotic even if symptoms improve","Drink enough to produce about 2000 mL of urine daily unless restricted","Use phenazopyridine for 2 weeks","Symptoms often improve in 24–48 hours","Stop the antibiotic once burning stops"],key:[0,1,3],
 rat:"Complete the course; hydrate to 2000 mL output; relief typically in 24–48 h; phenazopyridine limited to 2 days.",
 why:{2:"Limit to 2 days.",4:"Stopping early promotes recurrence."},src:["URI","UTI treatment and teaching"],obj:"Teach UTI medication use.",short:"Finish antibiotics; Pyridium 2 days max."},
{id:"u3",sys:["uri","neuro"],fmt:"mc",d:3,drug:"oxybutynin",concept:"bladder-drugs",
 stem:"Which drug would treat an older adult's nonobstructive urinary retention?",
 opts:["Bethanechol","Oxybutynin","Phenazopyridine","Tamsulosin, because it contracts the detrusor muscle"],key:0,
 rat:"Bethanechol (cholinergic) contracts the bladder. Oxybutynin (anticholinergic) treats urgency/incontinence and can cause retention. Phenazopyridine only numbs urinary pain. Tamsulosin relaxes prostate/bladder-neck smooth muscle (obstructive BPH); it does not contract the detrusor. Note: one slide in your Neuro file reverses these — see the flag on oxybutynin.",
 why:{1:"Oxybutynin is anticholinergic and can cause retention.",2:"Phenazopyridine only relieves urinary pain; it does not empty the bladder.",3:"Tamsulosin relaxes smooth muscle for obstructive BPH; it does not contract the detrusor."},src:["PAIN","Bethanechol"],obj:"Differentiate bladder drugs.",short:"Bethanechol = 'bladder go'; oxybutynin = 'bladder slow'."},
{id:"u4",sys:["uri","infect"],fmt:"mc",d:2,drug:"smxtmp",concept:"bactrim-k",
 stem:"A client on lisinopril is prescribed sulfamethoxazole-trimethoprim for a UTI. Which lab should the nurse monitor?",
 opts:["Potassium","Magnesium","Ammonia","TSH"],key:0,
 rat:"Your Cardiovascular file: monitor potassium when trimethoprim is used with ACE inhibitors.",why:{1:"Magnesium is not the interaction concern.",2:"Ammonia is not affected.",3:"TSH is not affected."},src:["CV","ACE inhibitor interactions (trimethoprim)"],obj:"Spot hyperkalemia interactions.",short:"Bactrim + ACE → potassium."},
{id:"u5",sys:["uri","cardio"],fmt:"mc",d:2,drug:"furosemide",concept:"loop",
 stem:"Which finding best shows furosemide is working in a client with HF?",
 opts:["Weight down 1.5 kg in 24 hours with clearer lung sounds","Potassium 3.1 mEq/L","BP 88/50","Urine output 20 mL/h"],key:0,
 rat:"Expected outcome is fluid loss and less congestion. Low K⁺, hypotension and low output are problems.",why:{1:"Low potassium is an adverse effect, not a sign of effectiveness.",2:"Hypotension is a problem, not the goal.",3:"Low urine output suggests the diuretic isn't working or perfusion is poor."},src:["MSK","F&E course notes"],obj:"Evaluate diuretic effectiveness.",short:"Diuretic works → weight down, lungs clearer."},

/* ── INFECT ── */
{id:"x1",sys:["infect"],fmt:"mc",d:2,drug:"vancomycin",concept:"vanc",
 stem:"Ten minutes into an IV vancomycin infusion, the client's face, neck and chest flush red and BP drops slightly. What should the nurse do first?",
 opts:["Stop or slow the infusion and notify the provider","Speed up the infusion to finish quickly","Give the next dose early","Apply cool compresses and continue"],key:0,
 rat:"Rapid vancomycin infusion causes an infusion reaction; slow/stop and notify. Usually infused over at least 60 minutes. (Reference content.)",
 why:{1:"Faster infusion worsens the infusion reaction.",2:"An early dose increases exposure; it doesn't treat the reaction.",3:"Continuing at the same rate ignores the reaction."},src:null,obj:"Respond to vancomycin infusion reaction.",short:"Vanc flush → slow down."},
{id:"x2",sys:["infect"],fmt:"sata",d:2,drug:"gentamicin",concept:"aminoglycoside",
 stem:"A client on gentamicin should be monitored for which effects? Select all that apply.",
 opts:["Ringing in the ears","Dizziness/vertigo","Rising creatinine","Decreasing urine output","Red-orange urine"],key:[0,1,2,3],
 rat:"Aminoglycosides cause ototoxicity and nephrotoxicity.",why:{4:"That's rifampin or phenazopyridine."},src:["INT","Table 43.6 gentamicin"],obj:"Monitor aminoglycoside toxicity.",short:"Gentamicin: ears + kidneys."},
{id:"x3",sys:["infect","resp"],fmt:"mc",d:2,drug:"ciprofloxacin",concept:"cipro",
 stem:"A client on ciprofloxacin asks how to take it with an antacid. Best answer?",
 opts:["Take cipro with a full glass of water, 1 hour before or 2 hours after antacids or meals","Take them together","Take the antacid 15 minutes before","Cipro and antacids don't interact"],key:0,
 rat:"Your Urinary file: full glass of water, 1 h before or 2 h after meals or antacids.",why:{1:"Antacids taken together reduce cipro absorption.",2:"15 minutes is too close; the file says 1 h before or 2 h after.",3:"Antacids do interact with ciprofloxacin."},src:["URI","Fluoroquinolones"],obj:"Time fluoroquinolone administration.",short:"Cipro: separate from antacids."},
{id:"x4",sys:["infect"],fmt:"mc",d:2,drug:"amoxicillin",concept:"abx-allergy",
 stem:"Before giving the first dose of IV ampicillin, which action is most important?",
 opts:["Verify allergy history and have emergency equipment available","Check blood glucose","Obtain a stool sample","Check the apical pulse"],key:0,
 rat:"Penicillins can cause anaphylaxis; confirm allergies before the first dose and observe.",why:{1:"Glucose is not the priority before a penicillin.",2:"A stool sample is not required first.",3:"Apical pulse is a digoxin check, not a penicillin check."},src:["INT","Cellulitis: antibiotics"],obj:"Prevent anaphylaxis.",short:"Antibiotic first dose → allergy check."},
{id:"x5",sys:["infect","integ"],fmt:"mc",d:1,drug:"cephalexin",concept:"cephalexin",
 stem:"Per your Integumentary notes, what can be given with cephalexin to reduce GI problems?",
 opts:["Probiotics","Antacids","Iron","Grapefruit juice"],key:0,rat:"Your source notes cephalexin can cause diarrhea and should be given with probiotics.",
 why:{1:"Antacids are not the source's measure for cephalexin GI effects.",2:"Iron does not reduce GI problems.",3:"Grapefruit juice is not the listed measure."},src:["INT","Cellulitis: cephalexin"],obj:"Recall cephalexin nursing tip.",short:"Keflex → probiotics for diarrhea."},

/* ── ONC ── */
{id:"o1",sys:["onc"],fmt:"mc",d:2,drug:"allopurinol",concept:"tumor-lysis",
 stem:"A client with a high tumor burden starts chemotherapy. Which drug and nursing measure help prevent uric acid complications?",
 opts:["Allopurinol plus generous fluids","Furosemide plus fluid restriction","Calcium supplements","Potassium supplements"],key:0,
 rat:"Cell lysis releases uric acid; allopurinol reduces production and fluids dilute urine.",why:{1:"Restricting fluids concentrates urine and raises uric acid risk.",2:"Calcium does not prevent uric acid complications.",3:"Potassium is released by cell lysis; supplements add risk."},src:["BL","Multiple myeloma: hyperuricemia with chemotherapy"],obj:"Prevent tumor lysis complications.",short:"Chemo + big tumor → allopurinol + fluids."},
{id:"o2",sys:["onc","blood"],fmt:"sata",d:2,concept:"chemo-se",
 stem:"Which findings are expected effects of bone marrow suppression from chemotherapy? Select all that apply.",
 opts:["Fatigue and pallor (anemia)","Petechiae and bleeding gums (thrombocytopenia)","Fever and infection (neutropenia)","Hypertension from fluid overload","Weight loss from hyperthyroidism"],key:[0,1,2],
 rat:"Marrow suppression causes anemia, thrombocytopenia and neutropenia.",src:["REP","Chemotherapy adverse effects"],obj:"Recognize marrow suppression.",short:"Marrow down = tired, bleeding, infected."},
{id:"o3",sys:["onc","msk"],fmt:"mc",d:3,drug:"methotrexate",concept:"mtx",
 stem:"A client with RA says, 'I take my methotrexate every morning.' What should the nurse do?",
 opts:["Clarify — RA methotrexate is usually a weekly dose","Praise the routine","Suggest taking it with alcohol to reduce nausea","Tell the client to double up if a dose is missed"],key:0,
 rat:"Daily dosing of weekly methotrexate causes serious toxicity (reference content). Weekly dosing in your PEDS ALL protocol too.",
 why:{1:"Praising daily dosing reinforces a dangerous error.",2:"Alcohol adds liver toxicity.",3:"Doubling doses increases toxicity."},src:["PEDS","ALL protocol"],obj:"Prevent methotrexate dosing errors.",short:"Methotrexate for RA = weekly."},
{id:"o4",sys:["onc","pain"],fmt:"mc",d:2,drug:"morphine",concept:"opioid-se",
 stem:"A client with cancer pain on scheduled morphine has not had a bowel movement in 4 days. What should be part of the plan?",
 opts:["A scheduled bowel regimen with fluids and fiber","Stop the morphine","Restrict fluids","Wait — constipation resolves on its own"],key:0,
 rat:"Opioid constipation doesn't develop tolerance; start a bowel regimen.",why:{1:"Stopping scheduled pain control isn't needed; treat the constipation.",2:"Fluids are increased, not restricted.",3:"Opioid constipation does not resolve with tolerance."},src:["PAIN","Opiate agonists"],obj:"Prevent opioid constipation.",short:"Opioids → bowel regimen."},
{id:"o5",sys:["onc"],fmt:"mc",d:2,drug:"vincristine",concept:"vinca",
 stem:"A child receiving vincristine reports tingling in the fingers and constipation. Which is most likely?",
 opts:["Neurotoxicity from vincristine","Hypocalcemia from milk","An expected viral illness","Bone marrow recovery"],key:0,
 rat:"Vincristine commonly causes peripheral neuropathy and constipation (reference content).",why:{1:"Milk doesn't cause these findings.",2:"These findings match vincristine toxicity, not a virus.",3:"Marrow recovery doesn't cause tingling or constipation."},src:null,obj:"Recognize vinca alkaloid neurotoxicity.",short:"Vincristine → nerves and bowels."},

/* ── PAIN ── */
{id:"pa1",sys:["pain"],fmt:"mc",d:3,drug:"naloxone",concept:"opioid-resp",
 stem:"After naloxone, a postoperative client is awake with RR 16, reports pain 7/10, nausea and sweating. Morphine PRN is ordered. Which action is most important?",
 opts:["Continue frequent vital signs because naloxone's effect is short","Give morphine now since breathing recovered","Return to every-4-hour vital signs","Tell the client nausea means naloxone allergy"],key:0,
 rat:"Naloxone is short-acting; respiratory depression can return. Nausea/sweating are expected with early reversal. Report pain for a new plan.",
 why:{1:"Repeating the opioid risks recurrence without new orders.",2:"Too infrequent.",3:"These are expected reversal effects."},
 src:["PAIN","Naloxone"],obj:"Monitor after opioid reversal.",short:"Naloxone wears off first — keep watching."},
{id:"pa2",sys:["pain"],fmt:"sata",d:2,drug:"morphine",concept:"opioid-resp",
 stem:"A client on morphine is difficult to arouse, RR 8, SpO₂ 86%. Which actions should the nurse take? Select all that apply.",
 opts:["Stimulate the client and call for help","Support the airway and apply oxygen per protocol","Stop any running opioid infusion and hold doses","Prepare naloxone for administration as ordered","Monitor VS and LOC at frequent intervals","Give the next scheduled dose so pain does not return"],key:[0,1,2,3,4],
 rat:"Respiratory depression is the priority opioid danger: arouse the client and get help, support airway and oxygenation, stop the opioid source, reverse with naloxone as ordered, then monitor closely because the duration of action of naloxone is short.",
 why:{5:"Another opioid dose would deepen respiratory depression; hold all opioid doses."},src:["PAIN","Naloxone premedication assessment"],obj:"Recognize the opioid-overdose response.",short:"Arouse → airway → stop opioid → naloxone → monitor."},
{id:"pa3",sys:["pain"],fmt:"mc",d:2,drug:"acetaminophen",concept:"apap-tox",
 stem:"A client takes acetaminophen 1000 mg four times daily plus an OTC 'night-time cold' product at bedtime. What is the priority concern?",
 opts:["Exceeding the daily acetaminophen limit — hepatotoxicity","Respiratory depression","Hyperkalemia","GI bleeding"],key:0,
 rat:"4000 mg/day is the source adult maximum; combination products add hidden acetaminophen.",why:{1:"Acetaminophen does not cause respiratory depression.",2:"Acetaminophen does not cause hyperkalemia.",3:"GI bleeding is an NSAID risk, not acetaminophen's main danger."},src:["PAIN","Acetaminophen"],obj:"Identify hidden acetaminophen.",short:"Count all acetaminophen sources."},
{id:"pa4",sys:["pain","psych"],fmt:"mc",d:2,drug:"ibuprofen",concept:"lithium-sodium",
 stem:"A client on lithium asks for something for a headache. Which OTC choice should the nurse question?",
 opts:["Naproxen","Acetaminophen","Rest and cool compress","Hydration"],key:0,
 rat:"NSAIDs such as ibuprofen and naproxen increase lithium levels.",why:{1:"Acetaminophen is not the NSAID that raises lithium levels.",2:"Rest and a cool compress are safe.",3:"Hydration is safe and helps keep lithium stable."},src:["PSY","Lithium interactions"],obj:"Screen OTCs with lithium.",short:"Lithium + NSAID = toxicity."},
{id:"pa5",sys:["pain","psych"],fmt:"mc",d:2,drug:"lorazepam",concept:"cns-depressant",
 stem:"A client receiving IV morphine also has lorazepam ordered PRN for anxiety. What is the main safety concern?",
 opts:["Additive respiratory depression and sedation","Hypertensive crisis","Hyperglycemia","Serotonin syndrome"],key:0,
 rat:"Opioids plus benzodiazepines potentiate CNS and respiratory depression.",why:{1:"Hypertensive crisis is an MAOI-tyramine danger.",2:"Hyperglycemia isn't the opioid-benzodiazepine risk.",3:"Serotonin syndrome isn't the main risk of this pair."},src:["MSK","Respiratory depressants with muscle relaxants"],obj:"Recognize CNS depressant interactions.",short:"Opioid + benzo = breathing risk."}
];

 allergy:"NKDA",meds:"Furosemide 40 mg daily, metoprolol 25 mg BID",note:"Client says food tastes 'off' and has been nauseated since yesterday.",
 opts:["Give the digoxin","Hold per the order parameter and notify the prescriber","Give half the dose","Give with a banana to raise potassium"],key:1,
 rat:"The order has its own parameter: HR 54 is below 60. Nausea and low K⁺ add toxicity concern, so hold and report all three findings.",
 why:{0:"Violates the hold parameter.",2:"Nurses can't change the dose.",3:"Food doesn't correct K⁺ or HR in time."},src:["CV","Digoxin implementation"]},
{id:"h2",drug:"amlodipine",title:"Antihypertensive after dialysis",
 order:"Amlodipine 10 mg PO daily. Hold if SBP <100 or HR <50 and notify.",pt:"66 y, ESRD; returned from dialysis 30 min ago.",
 vit:"BP 96/58 sitting, HR 88, dizzy when standing",labs:"K⁺ 4.6",allergy:"Sulfa",meds:"Epoetin weekly",note:"Client reports lightheadedness.",
 opts:["Give the amlodipine","Hold per parameter and notify the prescriber","Give and have client lie down","Ask client to drink 1 L of water first"],key:1,
 rat:"SBP 96 is below the order's 100 parameter, and the client is symptomatic after fluid removal.",why:{0:"Violates parameter.",2:"Still unsafe.",3:"ESRD clients are often fluid-restricted; not an order."},src:["CV","CCB premedication assessment"]},
{id:"h3",drug:"heparin",title:"Heparin with a new lab",
 order:"Heparin 5,000 units subcut every 8 h.",pt:"58 y, POD 2 hip replacement.",vit:"Stable",labs:"Platelets 62,000 (yesterday 210,000)",
 allergy:"NKDA",meds:"Acetaminophen PRN",note:"New bruising at injection sites.",
 opts:["Give the heparin","Hold and notify the prescriber of the platelet drop before the dose","Give in the thigh instead","Give and recheck platelets tomorrow"],key:1,
 rat:"A >50% platelet drop on heparin suggests heparin-induced thrombocytopenia (reference). Never give an anticoagulant without reviewing the newest labs; report first.",

{id:"h4",drug:"metformin",title:"Metformin before imaging",
 order:"Metformin 1000 mg PO BID with meals.",pt:"61 y, T2DM, CT abdomen with IV contrast scheduled at 1100.",vit:"Normal",labs:"Creatinine 1.6 (up from 1.1)",
 allergy:"Iodine-shellfish (reported)",meds:"Lisinopril",note:"NPO since midnight for CT.",
 opts:["Give metformin with a sip of water","Hold and clarify the metformin order with the prescriber before contrast","Give the evening dose early","Switch to insulin on your own"],key:1,
 rat:"Metformin around iodinated contrast with rising creatinine needs clarification per protocol; client is also NPO. (Hold timing varies by facility — follow the clarified order.)",

/* activity curve 0..1 for hour t after injection (teaching shape, labeled as approximate) */
function insAct(c, t) {
  if (t <= 0) return 0;
  const on = c.on, end = c.dur[1];
  if (t >= end) return 0;
  if (!c.pk) { const plateau = c.k === "ultra" ? .38 : .48, ease = x => (1 - Math.cos(Math.PI * Math.min(1, Math.max(0, x)))) / 2; if (t < on + 2) return plateau * ease(t / (on + 2)); if (t > end - 4) return plateau * ease((end - t) / 4); return plateau; }
  const pc = (c.pk[0] + c.pk[1]) / 2; // smooth teaching curve centered in the labeled peak window
  if (t < on) return .06 * t / on;
  if (t < pc) return .06 + .94 * (1 - Math.cos(Math.PI * (t - on) / (pc - on))) / 2;
  return (1 + Math.cos(Math.PI * (t - pc) / (end - pc))) / 2;
}
function insPhase(c, t) {
  if (t < 0) return "Not given yet";
  if (t >= c.dur[1]) return "Action over";
  if (t < c.on) return "Starting (before onset)";
  if (c.pk && t >= c.pk[0] && t <= c.pk[1]) return "PEAK window — highest hypoglycemia concern";
  if (c.pk && t < c.pk[0]) return "Rising toward peak";
  if (!c.pk) return "Steady background action";
  return t <= c.dur[0] ? "Tapering" : "Tapering (end of usual range)";
}

const IQ = (id, concept, stem, opts, key, rat, why, d = 2, fmt) => ({ id: "ins" + id, sys: ["endo"], fmt: fmt || (Array.isArray(key) ? "sata" : "mc"), d, drug: concept.startsWith("mix") || concept === "syringe" ? "nph" : concept === "basal" ? "glargine" : concept === "timing" || concept === "rapid" ? "lispro" : "regular", concept: "ins-" + concept, stem, opts, key, rat, why, src: ["MS", "Insulin — see Insulin Lab sources"], obj: "Insulin safety", short: rat.split(". ")[0] + ".", ins: true });
const INS_Q = [
  IQ(1, "timing", "Which insulin category has an onset of about 15 minutes and a peak of about 1 hour?", ["Rapid-acting", "Short-acting (regular)", "Intermediate (NPH)", "Long-acting"], 0, "CDC: rapid-acting onset 15 min, peak 1 h, duration 2–4 h.", { 1: "Regular: onset ~30 min, peak 2–3 h.", 2: "NPH: onset 2–4 h.", 3: "Long-acting: no pronounced peak." }, 1),
  IQ(2, "timing", "NPH was given at 0700. Which time falls in its usual peak window?", ["0730", "0830", "1400", "0200 the next day"], 2, "CDC: NPH peaks 4–12 h after injection → 1100 to 1900. 1400 is inside that window.", { 0: "Before NPH onset (2–4 h).", 1: "Still before onset.", 3: "19 h later — past the usual 12–18 h duration." }),
  IQ(3, "timing", "Regular insulin is usually given how long before a meal?", ["Right as the meal is eaten", "30–60 minutes before", "4 hours before", "Only after the meal"], 1, "CDC: regular/short-acting is usually taken 30–60 minutes before a meal because its onset is about 30 minutes.", { 0: "That timing fits rapid-acting analogs.", 2: "Too early — much of the action would precede the meal.", 3: "Regular is not routinely given after meals." }),
  IQ(4, "timing", "Which insulin has no pronounced peak and lasts about 24 hours?", ["Lispro", "Regular", "NPH", "Glargine U-100"], 3, "CDC: long-acting insulin does not peak and lasts up to about 24 hours.", { 0: "Rapid-acting, peaks ~1 h.", 1: "Short-acting, peaks 2–3 h.", 2: "Intermediate, peaks 4–12 h." }, 1),
  IQ(5, "timing", "Which insulin lasts 36 hours or longer?", ["Degludec (Tresiba)", "Aspart (NovoLog)", "NPH (Humulin N)", "Regular (Novolin R)"], 0, "CDC: ultra-long-acting insulin (e.g., degludec) lasts 36 hours or longer.", { 1: "Rapid-acting: 2–4 h.", 2: "Intermediate: 12–18 h.", 3: "Short-acting: 3–6 h." }),
  IQ(6, "timing", "A client asks why she still has to take NPH and a meal insulin. Which statement explains the roles best?", ["NPH covers background needs; the meal insulin covers food", "Both are meal insulins", "NPH is only for emergencies", "Meal insulin replaces basal insulin overnight"], 0, "Basal (background) insulin covers needs between meals and overnight; bolus/meal insulin covers food and corrections.", { 1: "NPH is an intermediate basal insulin.", 2: "NPH is a routine basal insulin.", 3: "Rapid/short insulin doesn't last overnight." }),
  IQ(7, "rapid", "Per the Humalog label, when is subcutaneous lispro given relative to a meal?", ["1 hour before", "Within 15 minutes before a meal or right after eating", "At bedtime only", "30–60 minutes after the meal"], 1, "Humalog label: within fifteen minutes before a meal or immediately after a meal.", { 0: "Too early for a rapid analog.", 2: "Lispro is a meal/correction insulin.", 3: "Not the labeled timing." }),
  IQ(8, "rapid", "Which pair is correctly matched?", ["Lispro — Humalog", "Aspart — Lantus", "Glargine — NovoLog", "NPH — Tresiba"], 0, "Lispro = Humalog/Admelog; aspart = NovoLog; glargine = Lantus/Basaglar/Semglee; degludec = Tresiba; NPH = Humulin N/Novolin N.", { 1: "Lantus is glargine.", 2: "NovoLog is aspart.", 3: "Tresiba is degludec." }, 1),
  IQ(9, "rapid", "Which statement about IV insulin is accurate?", ["Regular insulin is the only insulin that can ever be given IV", "Regular U-100 is the classic IV insulin, and some rapid analogs (e.g., lispro U-100, aspart) are also labeled for supervised IV use; concentrated insulins are never IV", "Glargine can be given IV in DKA", "NPH is preferred for IV drips"], 1, "Labels: Humalog U-100 and NovoLog may be given IV only under medical supervision; Humalog U-200 must not be given IV; Lantus and Humulin N are not for IV use.", { 0: "Your course slide says this, but current labels show it isn't the only one.", 2: "Lantus label: do not give IV.", 3: "Humulin N label: do not give IV." }, 3),
  IQ(10, "hypo", "A client's glucose is 64 mg/dL. The client is alert and can swallow. What does the nurse give first?", ["15–20 g of fast-acting carbohydrate such as 4–6 oz of juice", "Glucagon IM", "The scheduled insulin with a snack", "Nothing; recheck in an hour"], 0, "Course: hypoglycemia is glucose <70; an alert client who can swallow gets 15–20 g quick carbohydrate by mouth, then a recheck per protocol.", { 1: "Glucagon is for a client who can't take oral carbohydrate.", 2: "Insulin worsens hypoglycemia.", 3: "Hypoglycemia needs treatment now." }, 1),
  IQ(11, "hypo", "A client with a glucose of 38 mg/dL is unresponsive. There is no IV access. Which order does the nurse anticipate?", ["Orange juice by mouth", "Glucagon IM per protocol", "Regular insulin IV", "A high-protein snack"], 1, "Course: unconscious → glucagon IM (or IV dextrose 50% by the RN when IV access exists). Never give oral fluids to an unresponsive client.", { 0: "Aspiration risk.", 2: "Insulin lowers glucose further.", 3: "Can't eat, and protein is slow." }),
  IQ(12, "hypo", "Which findings suggest hypoglycemia? Select all that apply.", ["Sweating", "Trembling", "Hunger", "Irritability", "Fruity breath", "Deep rapid respirations"], [0, 1, 2, 3], "Course: faintness, hunger, excessive perspiration, irritability, trembling. Fruity breath and deep respirations suggest hyperglycemia/DKA.", { 4: "Acetone breath points to ketoacidosis.", 5: "Kussmaul-type breathing points to DKA." }, 1),
  IQ(13, "hypo", "After treating a low glucose in an alert client, what should happen next?", ["Recheck the glucose per protocol (commonly about 15 minutes) and repeat treatment if still low", "Give the routine insulin dose right away", "Document and wait for the next scheduled check", "Restrict fluids"], 0, "Treat, recheck, repeat if still low, then report — the next insulin dose is clarified rather than given automatically.", { 1: "Insulin doses after a low need review.", 2: "Recheck is required to confirm recovery.", 3: "Not related." }),
  IQ(14, "hypo", "Which medication can mask the tachycardia and tremor of hypoglycemia?", ["Metoprolol", "Furosemide", "Acetaminophen", "Omeprazole"], 0, "Beta blockers can mask adrenergic hypoglycemia signs; sweating may remain.", { 1: "Not a masking drug.", 2: "Not a masking drug.", 3: "Not a masking drug." }),
  IQ(15, "basal", "A client with type 1 diabetes is NPO for surgery tomorrow. Glargine is due tonight. What is the best action?", ["Hold the glargine because the client is NPO", "Obtain the NPO basal-insulin plan from the prescriber before the dose time; basal insulin is still needed", "Give double the dose to prevent DKA", "Switch to oral medication"], 1, "People with type 1 diabetes make no insulin; omitting basal insulin can lead to ketosis/DKA. Doses are often adjusted for NPO — that is a prescriber decision.", { 0: "Unsafe blanket rule.", 2: "Changing the dose is prescribing and risks hypoglycemia.", 3: "Oral agents are never for type 1 (course)." }, 3),
  IQ(16, "basal", "Which statement about glargine (Lantus) is correct?", ["It must always be given at bedtime", "It is given once daily at any time of day, at the same time each day", "It is cloudy and must be rolled", "It can be mixed with regular insulin"], 1, "Lantus label: once daily at any time of day but at the same time every day; clear; do not mix or dilute.", { 0: "Bedtime is common, not required.", 2: "Glargine is clear.", 3: "Never mix glargine." }),
  IQ(17, "basal", "Why is glargine's clear appearance a safety concern?", ["It can be confused with regular insulin, which is also clear", "Clear insulin is expired", "It means the insulin was frozen", "It can't be seen in a syringe"], 0, "Both regular and glargine are clear — identify by the label, never by appearance.", { 1: "Clear is normal for glargine.", 2: "Not related.", 3: "Not a real issue." }),
  IQ(18, "basal", "A client with type 2 diabetes on NPH and lispro will be NPO all day. Which nurse statement is best?", ["\"I'll hold every insulin dose today.\"", "\"I'll give everything as usual.\"", "\"I'll check which doses are meal-related and ask the RN/prescriber for today's NPO insulin plan.\"", "\"I'll give the lispro and hold the NPH.\""], 2, "NPO plans are individualized: meal doses usually aren't given without food, while basal and correction orders need the prescriber's direction.", { 0: "Unsafe blanket rule.", 1: "Meal coverage without food risks hypoglycemia.", 3: "Backwards — lispro is the meal insulin." }),
  IQ(19, "mix", "When mixing regular and NPH in one syringe, which is the correct sequence?", ["Air into NPH, air into regular, draw regular, draw NPH", "Draw NPH, then regular", "Air into regular, draw regular, air into NPH, draw NPH", "Mix them in the NPH vial first"], 0, "AIR into CLOUDY, AIR into CLEAR; DRAW CLEAR, DRAW CLOUDY. Humulin N label: regular drawn first; inject immediately.", { 1: "Drawing NPH first risks contaminating the regular vial with NPH.", 2: "Injecting air into the NPH vial while regular is already in the syringe can push regular into the NPH vial — air goes into both vials first.", 3: "Never combine insulins in a vial." }, 2),
  IQ(20, "mix", "Why is regular insulin drawn up before NPH?", ["To keep NPH out of the clear regular vial", "Regular is more expensive", "NPH needs to warm up", "It makes the injection less painful"], 0, "Drawing clear first prevents cloudy NPH from contaminating the regular vial, which would change its action.", { 1: "Not related.", 2: "Not the reason.", 3: "Not the reason." }, 1),
  IQ(21, "mix", "Ordered: regular 8 units + NPH 18 units. To which mark is the syringe filled when the NPH is added?", ["18 units", "8 units", "26 units", "10 units"], 2, "Draw regular to the 8-unit mark, then add NPH until the syringe reads the total: 8 + 18 = 26 units.", { 0: "That is the NPH dose alone.", 1: "That's only the regular.", 3: "18 − 8 isn't the total." }, 1),
  IQ(22, "mix", "While adding NPH, the nurse overshoots the total mark. What is correct?", ["Push the extra back into the NPH vial", "Discard the syringe and start over with a new syringe", "Squirt the excess into the sink", "Give it and document the extra"], 1, "Mixed insulin is never returned to a vial — that contaminates it and leaves an unknown ratio in the syringe. Discard and restart.", { 0: "Contaminates the vial; the syringe ratio is no longer known.", 2: "The ratio of regular to NPH in the syringe is no longer known.", 3: "An overdose is a medication error." }),
  IQ(23, "mix", "Which insulin may NEVER be mixed with another insulin?", ["NPH", "Regular", "Glargine (Lantus)", "Lispro U-100"], 2, "Lantus label: do not dilute or mix with any other insulin or solution.", { 0: "NPH may be mixed with regular or labeled rapid insulin.", 1: "Regular may be mixed with NPH.", 3: "Lispro U-100 may be mixed with NPH only (label)." }, 1),
  IQ(24, "mix", "Lispro U-100 and NPH are ordered together. Per the Humalog label, which is correct?", ["Draw lispro first and inject immediately after mixing", "Draw NPH first", "Let the mixture stand 30 minutes before injecting", "Lispro U-100 can never be mixed"], 0, "Humalog U-100 may be mixed with NPH only; draw Humalog first; inject immediately.", { 1: "Clear (rapid) goes first.", 2: "Inject immediately.", 3: "U-100 may be mixed with NPH; U-200 may not." }),
  IQ(25, "mix", "How is NPH resuspended before drawing it up?", ["Shake vigorously", "Gently roll between the palms and invert per the label", "Warm it in the microwave", "Let it settle"], 1, "Humulin N label: gently roll at least 10 times and invert at least 10 times; it should be uniformly cloudy. Never shake.", { 0: "Shaking creates bubbles and inaccurate doses.", 2: "Heat destroys insulin.", 3: "NPH must be resuspended." }, 1),
  IQ(26, "mix", "Which vial should NOT be used?", ["Regular insulin that is clear", "NPH that is uniformly cloudy after rolling", "Regular insulin that looks cloudy", "Glargine that is clear and colorless"], 2, "Regular should be clear. Cloudy regular (or clumped/frosted NPH) is discarded and replaced.", { 0: "Normal.", 1: "Normal.", 3: "Normal." }),
  IQ(27, "syringe", "On a 100-unit (1 mL) U-100 insulin syringe, each small line usually equals how many units?", ["1 unit", "2 units", "5 units", "0.1 unit"], 1, "100-unit syringes are usually marked in 2-unit increments; 30- and 50-unit syringes in 1-unit increments. Read the syringe you are holding.", { 0: "That's typical of 30- and 50-unit syringes.", 2: "Too large.", 3: "Insulin syringes aren't marked in tenths." }),
  IQ(28, "syringe", "A U-100 insulin syringe contains 15 units. Which statement is correct?", ["The dose is measured in units on the insulin syringe; converting to mL isn't needed", "Draw 15 mL", "Use a 3 mL syringe and draw 1.5 mL", "Insulin is always measured in mL"], 0, "Insulin is prescribed and measured in units with a matching insulin syringe. (15 units of U-100 happens to be 0.15 mL, but you measure units.)", { 1: "15 mL would be 1,500 units.", 2: "1.5 mL of U-100 = 150 units — a tenfold error.", 3: "Units, not mL." }, 1),
  IQ(29, "syringe", "Which syringe is best for a 26-unit total dose?", ["30-unit (0.3 mL) U-100 insulin syringe", "3 mL Luer-lock syringe", "Tuberculin syringe", "U-500 syringe"], 0, "The smallest U-100 insulin syringe that holds the full dose gives the most precise reading.", { 1: "Not marked in units.", 2: "Marked in mL — invites conversion errors.", 3: "For U-500 insulin only." }),
  IQ(30, "conc", "What does U-100 mean?", ["100 units per mL", "100 units per dose", "100 mL per vial", "Use within 100 days"], 0, "U-100 = 100 units of insulin in each mL — a concentration, not a dose.", { 1: "It's a concentration, not a dose.", 2: "Not a volume.", 3: "Not a storage rule." }, 1),
  IQ(31, "conc", "Which statement about concentrated insulin (U-200, U-300, U-500) is correct?", ["All insulin is U-100, so any insulin syringe works", "Use only the product's own pen or dedicated syringe; never transfer from a pen to a syringe", "U-500 may be given IV", "Concentrated insulin can be mixed with NPH"], 1, "Concentrated insulins are high-alert. Humalog U-200: never transferred to a syringe, never mixed, never IV. U-500 requires its dedicated pen or U-500 syringe.", { 0: "Your PEDS file says all insulin is 100 U/mL — that's outdated; concentrated forms exist.", 2: "Concentrated insulin is never IV.", 3: "Concentrated forms are not mixed." }, 3),
  IQ(32, "conc", "A pharmacy delivers a Humalog U-200 pen. Which action is unsafe?", ["Dialing the ordered units on the pen", "Drawing insulin out of the pen with a U-100 syringe", "Attaching a new needle", "Checking the label against the MAR"], 1, "Humalog label: do NOT transfer U-200 from the prefilled pen to a syringe.", { 0: "The U-200 pen dials the dose in units correctly.", 2: "A new needle is correct.", 3: "Correct verification." }),
  IQ(33, "technique", "Which are appropriate for a subcutaneous insulin injection? Select all that apply.", ["Inspect the site for lumps or scarring first", "Rotate sites within an area", "Aspirate before injecting", "Massage the site afterward", "Dispose of the needle in a sharps container immediately"], [0, 1, 4], "Check for lipohypertrophy, rotate within an area, no routine aspiration or massage, sharps right away.", { 2: "Routine aspiration isn't done for SC insulin.", 3: "Massage can change absorption." }, 2),
  IQ(34, "technique", "Why does the nurse avoid injecting insulin into a lumpy, thickened area?", ["Lipohypertrophy can make absorption erratic", "It is more painful only", "It causes hypokalemia", "It speeds absorption dramatically"], 0, "Repeated injections in one spot create lipohypertrophy, which makes insulin absorption unpredictable.", { 1: "Pain isn't the main issue.", 2: "Not related.", 3: "Absorption becomes erratic, not reliably faster." }),
  IQ(35, "technique", "Which pen practice is correct?", ["Share a pen between patients if the needle is changed", "Use a new needle for each injection and keep each pen to one patient", "Skip priming to save insulin", "Store the pen with the needle attached"], 1, "Labels and the CDC: pens are never shared between patients, even if the needle is changed. Attach a new needle each time and prime per the pen's instructions.", { 0: "Never — blood can backflow into the cartridge.", 2: "Priming confirms flow and removes air.", 3: "Remove the needle after each use." }),
  IQ(36, "technique", "After pressing the pen's dose button, the nurse should:", ["Pull the needle out immediately", "Keep the needle in the skin for the time stated in the pen's instructions, then remove it", "Massage the site", "Recap the needle with two hands"], 1, "Holding for the labeled time lets the full dose leave the pen.", { 0: "Part of the dose may leak.", 2: "Not done.", 3: "Unsafe — dispose of it in sharps." }),
  IQ(37, "technique", "Which sites does your PEDS course list for insulin?", ["Upper arms, thighs, hips and abdomen", "Deltoid IM only", "Forearm and palm", "Scalp"], 0, "PEDS packet: the upper arms, thighs, hips and abdomen are usual injection sites.", { 1: "Insulin is SC.", 2: "Not standard sites.", 3: "Not a site." }, 1),
  IQ(38, "escalate", "Which findings require the nurse to stop and clarify before giving insulin? Select all that apply.", ["Two active orders for rapid-acting insulin with the same meal", "Glucose above the highest value on the written scale", "Order written as 'U' instead of 'units'", "Client eating breakfast with glucose 150 and a clear meal-dose order", "Concentrated insulin with only U-100 syringes on hand"], [0, 1, 2, 4], "Duplicates, values outside the scale, error-prone abbreviations and device/concentration mismatches all need clarification. A routine meal dose with food does not.", { 3: "This is a routine dose." }, 3),
  IQ(39, "escalate", "A client with type 1 diabetes has glucose 340 mg/dL, nausea and fruity breath. What is the nurse's priority?", ["Give the usual meal dose", "Notify the RN/prescriber promptly — possible DKA", "Encourage a big glass of juice", "Recheck tomorrow"], 1, "Course: DKA develops from lack of insulin; acetone breath, nausea and hyperglycemia are warning signs.", { 0: "The client is nauseated, and this needs evaluation.", 2: "Adds glucose.", 3: "Dangerous delay." }),
