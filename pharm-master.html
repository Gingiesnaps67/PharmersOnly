  LQQ(27, ["inhaler", "class"], "albuterol", LS.R, 1, "A client is wheezing and short of breath. Which inhaler should the nurse expect to give first?", ["Albuterol", "Fluticasone", "Salmeterol", "Tiotropium"], 0, "Albuterol is a short-acting beta-agonist — the rescue inhaler. The others are maintenance drugs.", { 1: "Controller; no immediate relief.", 2: "LABA; not rescue.", 3: "Maintenance anticholinergic." }, ["LQ", "p. 19"]),
  LQQ(28, ["inhaler", "ae"], "albuterol", LS.R, 1, "After albuterol, a client's heart rate is 104 and their hands are shaky. Breath sounds have improved. What is the best interpretation?", ["Expected beta-agonist effects; continue to monitor", "Signs of an overdose requiring naloxone", "An allergic reaction", "Proof the drug didn't work"], 0, "Tachycardia and tremor are common albuterol effects. Breathing improved = therapeutic effect.", { 1: "Naloxone is for opioids.", 2: "Not allergy.", 3: "Breathing improved." }, ["LQ", "p. 19"]),
  LQQ(29, ["inhaler", "priority"], "albuterol", LS.R, 3, "Right after using albuterol, a client's wheezing worsens and SpO₂ falls. What should the nurse do?", ["Stop the medication and get help immediately — possible paradoxical bronchospasm", "Give a second puff right away", "Have the client lie flat", "Document and reassess in an hour"], 0, "Slide p. 19: if paradoxical bronchospasm occurs (worsening wheezing), STOP the medication.", { 1: "Could worsen it.", 2: "Lying flat worsens breathing.", 3: "Delay is unsafe." }, ["LQ", "p. 19"]),
  LQQ(30, ["inhaler", "teaching"], "fluticasone", LS.R, 1, "Which instruction prevents the most common local adverse effect of inhaled fluticasone?", ["Rinse the mouth with water and spit after each use", "Shake the inhaler for 1 minute", "Use it only during an asthma attack", "Hold the breath for 30 seconds"], 0, "Inhaled steroids lower local immunity → oral candidiasis (thrush). Rinse and spit.", { 1: "Not the purpose.", 2: "Not a rescue drug.", 3: "Not the prevention." }, ["LQL", "p. 11"]),
  LQQ(31, ["inhaler", "admin"], "fluticasone", LS.R, 2, "A client uses albuterol and fluticasone inhalers each morning. Which order is generally taught when both are due?", ["Albuterol first, then fluticasone", "Fluticasone first, then albuterol", "Both at the same moment", "Only the steroid"], 0, "Open the airway with the bronchodilator first so the steroid reaches deeper airways (slide p. 19), unless the prescriber directs otherwise.", { 1: "Reverse of the teaching.", 2: "Can't be inhaled together.", 3: "Both are ordered." }, ["LQ", "p. 19"]),
  LQQ(32, ["inhaler", "admin"], "tiotropium", LS.R, 2, "A client says, \"I swallow my Spiriva capsule every morning.\" What is the nurse's best response?", ["\"The capsule goes into the HandiHaler and is inhaled — never swallowed.\"", "\"That's fine as long as you take it with food.\"", "\"Swallow two if you feel short of breath.\"", "\"It works the same either way.\""], 0, "Tiotropium capsules are for inhalation only via the HandiHaler.", { 1: "Wrong route.", 2: "Not a rescue drug.", 3: "Swallowing doesn't deliver it to the lungs." }, ["LQ", "pp. 19, 43"]),
  LQQ(33, ["inhaler", "admin"], "advair", LS.R, 2, "Which instruction is correct for a dry-powder inhaler such as Advair Diskus?", ["Exhale away from the device, then inhale quickly and deeply", "Shake well before each dose", "Breathe out into the mouthpiece before inhaling", "Inhale slowly over 5 seconds like an MDI"], 0, "DPIs: don't shake; don't exhale into the device (moisture clumps powder); inhale quickly and deeply.", { 1: "DPIs aren't shaken.", 2: "Wets the powder.", 3: "That's MDI technique." }, ["LQ", "p. 43"]),
  LQQ(34, ["inhaler", "class"], "montelukast", LS.R, 2, "Which teaching about montelukast is essential?", ["Report mood or behavior changes, including suicidal thoughts", "Use it to stop an asthma attack", "Take it only when wheezing", "It must be rinsed from the mouth"], 0, "Montelukast has an FDA boxed warning for serious neuropsychiatric events. It's a daily controller, not rescue.", { 1: "Not rescue.", 2: "Taken daily at the same time.", 3: "It's a tablet." }, ["LQ", "p. 59"]),
  LQQ(35, ["inhaler", "toxicity"], "theophylline", LS.R, 2, "A client taking theophylline has tremors, a pulse of 128, and vomiting. What should the nurse suspect?", ["Theophylline toxicity", "Expected effect", "Hypoglycemia", "Allergic reaction"], 0, "Slide p. 81: theophylline toxicity — tremors, arrhythmias, low K, abdominal pain, headache.", { 1: "Not expected.", 2: "No glucose data.", 3: "Not typical allergy." }, ["LQ", "p. 81"]),
  LQQ(36, ["inhaler", "class"], "salmeterol", LS.R, 2, "A student says, \"Salmeterol ends in -terol, so it's a rescue inhaler.\" How should the nurse respond?", ["\"Salmeterol is long-acting — maintenance only. Albuterol is the rescue inhaler.\"", "\"Correct — all -terol drugs are rescue drugs.\"", "\"Salmeterol is a steroid.\"", "\"Salmeterol is an anticholinergic.\""], 0, "Name endings help but have limits: salmeterol and formoterol are LABAs.", { 1: "Over-generalized.", 2: "It's a beta-agonist.", 3: "That's tiotropium/ipratropium." }, ["LQ", "p. 19"]),
  LQQ(37, ["inhaler", "admin"], "albuterol", LS.R, 2, "Put the metered-dose inhaler steps in order.", ["Shake (if the brand requires) and prime if new", "Breathe out fully", "Start a slow, deep breath and press the canister", "Keep inhaling until the lungs are full", "Hold the breath for up to 10 seconds, then breathe out slowly"], null, "MDI: shake/prime per brand → exhale → slow deep inhale while pressing → fill lungs → hold up to 10 s.", {}, ["LQL", "p. 11"], "order"),
  // ---- Insulin ----
  LQQ(38, ["insulin", "timing"], "nph", LS.E, 2, "A nurse gives NPH insulin at 1600 and the shift ends at 1900. When is hypoglycemia most likely?", ["About 2000 to 0400 — on the next shift", "1615–1630", "Within 30 minutes", "It cannot cause hypoglycemia"], 0, "NPH peaks about 4–12 hours after injection (slide and CDC). Document and hand off so the next shift watches for it.", { 1: "Too early.", 2: "Too early.", 3: "It can." }, ["LQL", "p. 13"]),
  LQQ(39, ["insulin", "timing"], "lispro", LS.E, 2, "Insulin lispro is given at 0800 with breakfast. Using the review slide (rapid peak 30–90 minutes), when is the hypoglycemia risk greatest?", ["About 0830–0930", "About 1000–1200", "About 1200–2000", "Around midnight"], 0, "Rapid-acting peaks soon after the meal (slide: 30–90 min; CDC ≈1 h).", { 1: "That's regular.", 2: "That's NPH.", 3: "Too late." }, ["LQ", "p. 49"]),
  LQQ(40, ["insulin", "timing"], "regular", LS.E, 2, "Regular insulin is given at 0800. When should the nurse watch most closely for hypoglycemia?", ["About 1000–1200", "0815", "1800", "0300 the next day"], 0, "Regular peaks about 2–4 hours (slide) / 2–3 hours (CDC).", { 1: "Before the peak.", 2: "Too late.", 3: "Too late." }, ["LQ", "p. 49"]),
  LQQ(41, ["insulin", "safety"], "glargine", LS.E, 3, "Which statement about glargine is correct?", ["It has no pronounced peak, but it can still cause hypoglycemia", "It never causes hypoglycemia", "It is mixed with regular insulin", "It is cloudy"], 0, "A flat profile lowers peak-related risk but doesn't remove hypoglycemia risk (excess dose, missed meals, illness).", { 1: "Corrected statement.", 2: "Never mix glargine.", 3: "It's clear." }, ["LQ", "p. 49"]),
  LQQ(42, ["insulin", "admin"], "nph", LS.E, 1, "When drawing up regular and NPH in one syringe, which is drawn into the syringe first?", ["Regular (clear)", "NPH (cloudy)", "Either one", "Neither — they can't be mixed"], 0, "Clear before cloudy.", { 1: "Contaminates the regular vial.", 2: "Order matters.", 3: "They're label-permitted to mix." }, ["LQ", "p. 49"]),
  LQQ(43, ["insulin", "handoff"], "nph", LS.E, 2, "Which handoff statement is most important after giving NPH at 1700?", ["\"NPH 20 units given at 1700 — watch for hypoglycemia overnight, especially 2100–0500.\"", "\"Patient ate dinner.\"", "\"Glucose was 180 before dinner.\"", "\"No changes.\""], 0, "The next shift must know the insulin type and time to anticipate the peak (4–12 h).", { 1: "Helpful but incomplete.", 2: "Helpful but incomplete.", 3: "Omits the risk." }, ["LQL", "p. 13"]),
  LQQ(44, ["insulin", "priority"], "lispro", LS.E, 2, "Lispro was given at 1200, but the lunch tray hasn't arrived at 1220 and the client is sweaty and shaky. Glucose is 64 mg/dL. The client is alert. What first?", ["Give 15–20 g fast-acting carbohydrate and recheck glucose", "Wait for the tray", "Give more insulin", "Call dietary and document"], 0, "Treat hypoglycemia first (alert, can swallow), recheck, then address the meal and report.", { 1: "Delays treatment.", 2: "Dangerous.", 3: "Doesn't treat now." }, ["MS", "Hypoglycemia slides"]),
  // ---- Thyroid ----
  LQQ(45, ["thyroid", "labs"], "levothyroxine", LS.E, 1, "Which lab pattern is typical of primary hypothyroidism?", ["TSH high, free T4 low", "TSH low, free T4 high", "TSH low, free T4 low", "TSH high, free T4 high"], 0, "The failing thyroid makes little hormone; the pituitary responds by raising TSH (negative feedback).", { 1: "Hyperthyroidism.", 2: "Suggests a pituitary (central) problem.", 3: "Unusual pattern." }, ["LQ", "p. 58"]),
  LQQ(46, ["thyroid", "labs"], "methimazole", LS.E, 1, "Which lab pattern fits primary hyperthyroidism?", ["TSH low, free T4 high", "TSH high, free T4 low", "TSH normal, free T4 normal", "TSH high, free T4 high"], 0, "Too much thyroid hormone suppresses pituitary TSH.", { 1: "Hypothyroidism.", 2: "Euthyroid.", 3: "Unusual." }, ["LQ", "p. 58"]),
  LQQ(47, ["thyroid", "toxicity"], "levothyroxine", LS.E, 2, "A client on levothyroxine reports palpitations, heat intolerance, insomnia and weight loss. What does this suggest?", ["Over-replacement — report; TSH will likely be low", "Under-replacement", "Expected adjustment", "Hypoglycemia"], 0, "Slide p. 58: over-treatment looks like hyperthyroidism.", { 1: "Under-replacement = fatigue, weight gain, cold intolerance.", 2: "Not expected.", 3: "Not thyroid-related." }, ["LQ", "p. 58"]),
  LQQ(48, ["thyroid", "teaching"], "levothyroxine", LS.E, 2, "Which statement shows correct levothyroxine teaching?", ["\"I'll take it in the morning on an empty stomach and take calcium or iron at least 4 hours apart.\"", "\"I'll take it with my calcium at dinner.\"", "\"I'll stop it when I feel better.\"", "\"I'll take it with my antacid to protect my stomach.\""], 0, "Empty stomach 30–60 min before breakfast; calcium, iron and some antacids reduce absorption.", { 1: "Reduces absorption.", 2: "Usually lifelong.", 3: "Reduces absorption." }, ["LQ", "p. 58"]),
  LQQ(49, ["thyroid", "priority"], "levothyroxine", LS.E, 3, "An older adult with heart disease is starting levothyroxine. Which finding requires immediate follow-up?", ["Chest pain and a rapid irregular pulse", "Mild fatigue during the first week", "Dry skin", "Constipation"], 0, "Thyroid hormone raises cardiac demand; older adults/cardiac patients start low and are watched for angina and dysrhythmias.", { 1: "Under-replacement symptoms improve slowly.", 2: "Hypothyroid sign.", 3: "Hypothyroid sign." }, ["LQ", "p. 58"]),
  LQQ(50, ["thyroid", "labs"], "levothyroxine", LS.E, 3, "In which situation can TSH be misleading?", ["A pituitary disorder (central hypothyroidism)", "Primary hypothyroidism", "Primary hyperthyroidism", "Normal thyroid"], 0, "If the pituitary can't make TSH, TSH may be low even though thyroid hormone is low — free T4 is needed.", { 1: "TSH works well here.", 2: "TSH works well here.", 3: "Not misleading." }, ["LQ", "p. 58"]),
  LQQ(51, ["thyroid", "ae"], "methimazole", LS.E, 2, "A client taking methimazole has a sore throat and fever. What is the priority?", ["Report immediately and anticipate a CBC — possible agranulocytosis", "Give acetaminophen and continue", "Encourage fluids only", "Expected effect"], 0, "Antithyroid drugs can cause agranulocytosis.", { 1: "Masks a dangerous sign.", 2: "Incomplete.", 3: "Not expected." }, null),
  // ---- Herbal & interactions ----
  LQQ(52, ["herbal", "interactions"], "sertraline", LS.P, 2, "A client taking sertraline starts St. John's wort. Which findings suggest serotonin syndrome? Select all that apply.", ["Agitation and confusion", "Fever and sweating", "Tremor and hyperreflexia/clonus", "Diarrhea", "Bradycardia and hypothermia"], [0, 1, 2, 3], "SJW + serotonergic antidepressants can cause serotonin syndrome: mental status changes, autonomic instability, neuromuscular hyperactivity, GI upset.", { 4: "Tachycardia and hyperthermia are typical." }, ["LQL", "pp. 9, 18"]),
  LQQ(53, ["herbal", "interactions"], "coc", ["repro"], 2, "Why should a client on oral contraceptives avoid St. John's wort?", ["It speeds hormone metabolism and can reduce contraceptive effectiveness", "It raises estrogen levels to toxic levels", "It causes hyperkalemia", "It has no interactions"], 0, "SJW induces CYP3A4/P-gp → lower hormone levels and breakthrough bleeding/pregnancy risk.", { 1: "Lowers, not raises.", 2: "Not related.", 3: "Many interactions." }, null),
  LQQ(54, ["herbal", "interactions"], "warfarin", LS.B, 2, "A client on warfarin wants to take ginkgo biloba. What should the nurse teach?", ["Ginkgo can increase bleeding risk — check with the provider; INR may need closer monitoring", "Ginkgo has no interactions", "Ginkgo lowers INR, so take more warfarin", "Take them at the same time to cancel each other"], 0, "Ginkgo inhibits platelet aggregation; it's associated with more bleeding when combined with warfarin.", { 1: "Interaction exists.", 2: "Never self-adjust.", 3: "Not how it works." }, ["LQL", "p. 9"]),
  LQQ(55, ["herbal", "interactions"], "lorazepam", LS.P, 2, "Which supplement adds dangerous sedation and liver risk when combined with alcohol or benzodiazepines?", ["Kava", "Vitamin C", "Fish oil", "Calcium"], 0, "Kava has sedative effects and has been linked to liver injury, especially with alcohol.", { 1: "Not this concern.", 2: "Bleeding concern, not sedation.", 3: "Absorption concern only." }, null),
  LQQ(56, ["herbal", "interactions"], "atorvastatin", LS.C, 2, "Which statement about grapefruit is accurate?", ["Grapefruit can raise levels of certain drugs (e.g., some statins, nifedipine, buspirone), but not every drug in a class", "Grapefruit interacts with all antidepressants equally", "Grapefruit only matters for antibiotics", "Grapefruit lowers all drug levels"], 0, "FDA: grapefruit affects specific drugs; check each drug.", { 1: "Over-generalized.", 2: "Wrong.", 3: "It usually raises levels." }, ["LQL", "p. 18"]),
  LQQ(57, ["herbal", "priority"], null, LS.PN, 2, "During medication reconciliation, why must the nurse ask about herbs and supplements?", ["Supplements can interact with prescribed drugs and change their effects", "Supplements are regulated exactly like drugs", "Only to complete the form", "Supplements never affect lab values"], 0, "Herbals (e.g., St. John's wort, ginkgo) cause clinically important interactions — include OTCs, vitamins and herbs.", { 1: "They're regulated differently.", 2: "Safety, not paperwork.", 3: "They can (e.g., INR)." }, ["LQL", "p. 9"]),
  // ---- Other review-emphasized meds ----
  LQQ(58, ["admin", "teaching"], "alendronate", ["msk"], 2, "Which instruction is correct for alendronate?", ["Take it first thing in the morning with a full glass of plain water and stay upright for 30 minutes", "Take it at bedtime with milk", "Take it with breakfast", "Lie down after taking it"], 0, "Empty stomach, plain water, upright and nothing else for 30 minutes protects the esophagus and absorption.", { 1: "Lying down → esophagitis; milk blocks absorption.", 2: "Food blocks absorption.", 3: "Esophageal injury risk." }, ["LQ", "p. 11"]),
  LQQ(59, ["class"], "donepezil", LS.N, 2, "A daughter asks if donepezil will cure her father's Alzheimer's disease. Best response?", ["\"It may help memory and function for a while, but it doesn't cure or stop the disease.\"", "\"Yes, with time.\"", "\"It reverses brain damage.\"", "\"It has no effect at all.\""], 0, "Donepezil treats symptoms; the label notes no evidence it alters the underlying disease.", { 1: "Not a cure.", 2: "False.", 3: "It can help symptoms." }, ["LQ", "p. 10"]),
  LQQ(60, ["priority", "admin"], null, LS.B, 3, "Fifteen minutes into a blood transfusion, the client develops chills, a temperature rise from 37.0 to 38.4 °C, and low back pain. What should the nurse do first?", ["Stop the transfusion and keep the IV open with normal saline", "Give acetaminophen and continue", "Slow the transfusion", "Recheck vital signs in 30 minutes"], 0, "Back pain with fever suggests a severe (possibly hemolytic) reaction. Stop, keep the line open with NS, stay with the client, notify the provider and blood bank.", { 1: "Masks a dangerous reaction.", 2: "Any suspected reaction = stop.", 3: "Delay." }, ["LQ", "p. 18"]),
  LQQ(61, ["priority", "admin"], null, LS.B, 2, "A client receiving blood develops a few itchy hives but normal vital signs and no breathing problems. What is the best first action?", ["Stop the transfusion, keep the line open with normal saline, and notify the provider for orders", "Continue and document", "Remove the IV catheter", "Speed up the transfusion to finish"], 0, "Even mild-appearing reactions are evaluated: stop first; antihistamines and any decision to resume need an order/protocol.", { 1: "Corrected point.", 2: "Keep the access.", 3: "Increases exposure." }, ["LQ", "p. 18"]),
  LQQ(62, ["admin"], null, LS.B, 2, "Which verification is required before hanging blood?", ["Two licensed staff check the client's ID band against the blood bag, type and compatibility at the bedside", "One nurse checks the chart", "The client confirms their blood type verbally", "A CNA verifies alone"], 0, "Two people — one reads the bag, one checks the ID band; follow facility policy.", { 1: "Not enough.", 2: "Not a safe check.", 3: "Needs licensed staff per policy." }, ["LQL", "p. 5"]),
  LQQ(63, ["class", "ae"], "codeine", LS.R, 2, "Which assessment is the priority before giving dextromethorphan with codeine?", ["Respiratory rate and level of consciousness", "Bowel sounds only", "Blood glucose", "Pupil size only"], 0, "Codeine is an opioid → respiratory depression and sedation.", { 1: "Constipation matters, but breathing first.", 2: "Not relevant.", 3: "Incomplete." }, ["LQ", "p. 24"]),
  LQQ(64, ["teaching"], "codeine", LS.R, 2, "A client prescribed codeine cough syrup asks if it's OK to drive. Best response?", ["\"Don't drive or use machinery — that includes cars — until you know how it affects you.\"", "\"Driving is fine; only heavy equipment is a problem.\"", "\"Drive only at night.\"", "\"Have a drink to stay calm.\""], 0, "'Heavy machinery' includes cars, motorcycles and e-bikes. No alcohol.", { 1: "Patients often misunderstand this.", 2: "Unsafe.", 3: "Alcohol adds CNS depression." }, ["LQL", "p. 8"]),
  LQQ(65, ["class", "safety"], "fentanyl", LS.PN, 3, "Which order for a fentanyl patch should the nurse question?", ["Fentanyl patch for a 30-year-old opioid-naive client after an ankle fracture", "Fentanyl patch for a client on long-term opioids for cancer pain", "Remove the old patch before applying a new one", "Avoid heating pads over the site"], 0, "Transdermal fentanyl is only for opioid-tolerant patients with persistent pain — not acute pain in opioid-naive clients (fatal respiratory depression risk).", { 1: "Appropriate use.", 2: "Correct practice.", 3: "Correct practice." }, ["LQ", "pp. 40–41"]),
  LQQ(66, ["safety"], "fentanyl", LS.PN, 2, "A client with a fentanyl patch has a fever of 39.4 °C and is becoming drowsy with RR 9. What is the most likely explanation?", ["Heat increased fentanyl absorption — opioid overdose risk", "The patch stopped working", "Expected sedation", "Dehydration only"], 0, "Fever or external heat increases absorption from the patch; respiratory depression is the danger. Remove the patch, support breathing, get help, naloxone per protocol.", { 1: "Opposite.", 2: "RR 9 is dangerous.", 3: "Misses the opioid risk." }, ["LQ", "p. 40"]),
  LQQ(67, ["priority"], "naloxone", LS.PN, 2, "After naloxone, an opioid-overdose client wakes up agitated and vomiting. What should the nurse anticipate next?", ["Respiratory depression may return as naloxone wears off — keep monitoring and turn the client to the side", "The client is now safe and can be left alone", "Give another opioid for pain right away", "Discharge home"], 0, "Naloxone has a short half-life; withdrawal symptoms and vomiting are common.", { 1: "Unsafe.", 2: "Unsafe.", 3: "Unsafe." }, ["LQ", "p. 64"]),
  LQQ(68, ["interactions"], "sildenafil", LS.C, 2, "Which client statement requires immediate follow-up?", ["\"I take nitroglycerin for chest pain and just got a prescription for sildenafil.\"", "\"I take sildenafil 30 minutes before sexual activity.\"", "\"I had a mild headache after sildenafil.\"", "\"My face felt warm after sildenafil.\""], 0, "Nitrates + sildenafil → severe hypotension. Contraindicated.", { 1: "Correct use.", 2: "Common effect.", 3: "Common flushing." }, ["LQ", "p. 71"]),
  LQQ(69, ["admin"], "nitroglycerin", LS.C, 1, "Which action is essential when applying nitroglycerin ointment?", ["Wear gloves", "Rub it in deeply", "Apply to the same site each time", "Cover with a heating pad"], 0, "Wear gloves — skin contact can make the nurse hypotensive.", { 1: "Not how it's applied.", 2: "Rotate sites.", 3: "Never." }, ["LQ", "p. 61"]),
  LQQ(70, ["class"], "pantoprazole", LS.G, 2, "Why is pantoprazole often ordered with a scheduled NSAID?", ["To reduce acid and protect against GI bleeding", "To increase the NSAID's pain relief", "To prevent kidney injury", "To reduce bleeding from anticoagulants"], 0, "NSAIDs can cause ulcers/GI bleeding; a PPI lowers acid.", { 1: "No.", 2: "No.", 3: "No." }, ["LQ", "pp. 38–39"]),
  LQQ(71, ["ae"], "pantoprazole", LS.G, 2, "A client on long-term pantoprazole develops frequent watery stools and abdominal cramping. Priority?", ["Report — possible C. difficile infection", "Expected; give an antidiarrheal", "Increase the PPI", "Encourage dairy"], 0, "PPIs increase C. difficile risk (slide p. 39).", { 1: "Could worsen C. diff.", 2: "No.", 3: "No." }, ["LQ", "p. 39"]),
  LQQ(72, ["expected"], "lactulose", LS.G, 2, "Which finding shows lactulose is working for hepatic encephalopathy?", ["Ammonia falling and the client more alert and oriented", "No bowel movement for 2 days", "Rising ammonia", "Hard formed stools only"], 0, "Lactulose pulls ammonia into the stool; soft stools and better mental status show effect.", { 1: "Not working.", 2: "Worse.", 3: "Not the goal." }, ["LQ", "p. 57"]),
  LQQ(73, ["expected"], "peg", LS.G, 1, "After drinking GoLYTELY for a colonoscopy, the client has frequent watery stools. Interpretation?", ["Expected effect — monitor hydration and electrolytes", "An allergic reaction", "A sign to stop immediately", "Infection"], 0, "Diarrhea is the purpose; watch for dehydration.", { 1: "No.", 2: "Expected.", 3: "No." }, ["LQ", "p. 45"]),
  LQQ(74, ["expected"], "sps", LS.U, 2, "What is the goal of sodium polystyrene sulfonate (Kayexalate)?", ["Lower serum potassium", "Raise potassium", "Lower sodium", "Treat constipation"], 0, "It binds potassium in the bowel.", { 1: "Opposite.", 2: "It adds sodium.", 3: "Can cause constipation." }, ["LQ", "p. 52"]),
  LQQ(75, ["class"], "allopurinol", ["msk"], 1, "A client is having an acute gout attack. Which drug is used to treat the attack?", ["Colchicine", "Allopurinol", "Levothyroxine", "Alendronate"], 0, "Allopurinol prevents; colchicine treats acute attacks.", { 1: "Prevention.", 2: "No.", 3: "No." }, ["LQ", "p. 47"]),
  LQQ(76, ["teaching"], "rifampin", LS.I, 1, "Which teaching is essential for rifampin?", ["Urine, tears and sweat may turn red-orange; it can stain contact lenses", "Expect green urine", "Avoid all sunlight forever", "It has no drug interactions"], 0, "Rifampin colors body fluids red-orange and interacts with many drugs (including oral contraceptives).", { 1: "No.", 2: "Not the key point.", 3: "Many interactions." }, ["LQ", "p. 76"]),
  LQQ(77, ["class"], "tamsulosin", LS.U, 2, "How does tamsulosin improve BPH symptoms?", ["Relaxes smooth muscle in the prostate and bladder neck", "Shrinks the prostate", "Prevents the prostate from growing", "Kills bacteria"], 0, "Alpha-1 blocker; finasteride is the drug that shrinks the prostate.", { 1: "Finasteride.", 2: "Corrected point.", 3: "No." }, ["LQ", "p. 77"]),
  LQQ(78, ["safety"], "tamsulosin", LS.U, 2, "Which teaching is most important when starting tamsulosin?", ["Rise slowly — dizziness or fainting can occur, especially at first", "Take it with grapefruit", "Expect orange urine", "Stop if urine flow improves"], 0, "Orthostatic hypotension/syncope risk.", { 1: "No.", 2: "Rifampin.", 3: "Continue as prescribed." }, ["LQ", "p. 77"]),
  LQQ(79, ["priority"], "diazepam", LS.N, 2, "A client has been seizing for 6 minutes without regaining consciousness. Which medication class does the nurse anticipate first?", ["A benzodiazepine (e.g., IV lorazepam or diazepam, or IM midazolam)", "An antipsychotic", "A beta blocker", "An opioid"], 0, "Status epilepticus = seizure >5 minutes or repeated without recovery; benzodiazepines are first-line (AES).", { 1: "No.", 2: "No.", 3: "No." }, ["LQ", "pp. 83–84"]),
  LQQ(80, ["teaching"], "zolpidem", LS.P, 2, "Which statement shows the client understands zolpidem teaching?", ["\"I'll take it right before bed when I can sleep a full night.\"", "\"I'll take it with my morning pills.\"", "\"A glass of wine helps it work.\"", "\"Sleep-driving is normal.\""], 0, "Take at bedtime; avoid alcohol; report complex sleep behaviors.", { 1: "Next-day impairment.", 2: "CNS depression.", 3: "Dangerous; report." }, ["LQ", "p. 87"]),
  LQQ(81, ["admin"], "carbamide", ["integ"], 2, "Before instilling ear drops in a 2-year-old, how should the nurse position the pinna?", ["Down and back", "Up and back", "Straight up", "Forward"], 0, "Under 3: down and back; 3 and older/adults: up and back.", { 1: "Adults/children ≥3.", 2: "No.", 3: "No." }, ["LQL", "p. 19"]),

const MM = (() => {
  const EPS = 1e-6;
  /* round half up, guarding binary float artifacts (e.g. 2.25 → 2.3) */
  const round = (v, d = 0) => { const f = 10 ** d; return Math.round(Number((v * f).toPrecision(12))) / f; };
  const roundML = v => (Math.abs(v) < 1 ? round(v, 2) : round(v, 1));
  const ROUND_RULES = {
    ml: "Round mL to the tenth (or to the hundredth when the volume is less than 1 mL).",
    tenth: "Round to the nearest tenth.", hundredth: "Round to the nearest hundredth.", whole: "Round to the nearest whole number.",
    gtt: "Round drops per minute to the nearest whole drop — you can't count part of a drop.",
    kg: "Round kilograms to the nearest tenth before using the weight in a dose calculation.",
    tab: "Tablets: give whole tablets, or halves only when the tablet is scored.", none: "No rounding needed."
  };
  /* display: leading zero, no trailing zeros, thousands separators */
  const fmt = n => (typeof n !== "number" || !isFinite(n)) ? "—" : round(n, 4).toLocaleString("en-US", { maximumFractionDigits: 4 });

  /* ---------- calculation functions ---------- */
  const calc = {
    lbToKg: lb => lb / 2.2, kgToLb: kg => kg * 2.2,
    gToMg: g => g * 1000, mgToG: mg => mg / 1000, mgToMcg: mg => mg * 1000, mcgToMg: mcg => mcg / 1000,
    LToMl: L => L * 1000, mlToL: ml => ml / 1000, hToMin: h => h * 60, minToH: m => m / 60,
    tspToMl: t => t * 5, tbspToMl: t => t * 15, ozToMl: o => o * 30, mlToOz: ml => ml / 30,
    dh: (desired, have, qty) => desired / have * qty,
    wtDose: (kg, perKg) => kg * perKg,
    daily: (kg, perKgDay) => kg * perKgDay,
    perDose: (kg, perKgDay, nDoses) => kg * perKgDay / nDoses,
    dosesPerDay: hoursInterval => 24 / hoursInterval,
    safeRange: (kg, lo, hi, doseMg, nDoses) => { const min = kg * lo, max = kg * hi, daily = doseMg * nDoses; return { min, max, daily, within: daily >= min - EPS && daily <= max + EPS, below: daily < min - EPS, above: daily > max + EPS }; },
    mlPerHr: (ml, hours) => ml / hours,
    gttPerMin: (ml, df, minutes) => ml * df / minutes,
    conc: (amount, ml) => amount / ml,
    rateFromDose: (dosePerHr, amount, ml) => dosePerHr / (amount / ml),

    bsa: (cm, kg) => Math.sqrt(cm * kg / 3600),
    unitsToMlU100: units => units / 100

  /* ---------- seeded rng ---------- */
  function rng(seed) {
    let a = seed >>> 0;

    return { next, int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)), pick: arr => arr[Math.floor(next() * arr.length)], chance: p => next() < p };

  if (q.fmt === "bowtie") return `Condition: ${a.c != null ? q.cond[a.c] : "—"}; Actions: ${[...a.a].map(i => q.act[i]).join(", ")}; Monitor: ${[...a.m].map(i => q.mon[i]).join(", ")}`;

function correctText(q) {

function evaluate(q, a) {
  if (a == null) return false;
  if (q.fmt === "mc") return a === q.key;
  if (q.fmt === "sata") return a.size === q.key.length && q.key.every(k => a.has(k));
  if (q.fmt === "order") return a.every((v, i) => v === i);
  if (q.fmt === "matrix") return q.key.every((k, i) => a[i] === k);
  if (q.fmt === "bowtie") return a.c === q.condKey && a.a.size === 2 && q.actKey.every(k => a.a.has(k)) && a.m.size === 2 && q.monKey.every(k => a.m.has(k));

  if (q.fmt === "matrix") return a.every(v => v != null);
  if (q.fmt === "bowtie") return a.c != null && a.a.size === 2 && a.m.size === 2;

  if (q.fmt === "matrix") return q.rows.map(() => null);
  if (q.fmt === "bowtie") return { c: null, a: new Set(), m: new Set() };
  return null;
}

/* ---------- GAMES ---------- */
const GMODES = [
  ["brand", "Generic → brand", d => d.b && !/^[—(]/.test(d.b) ? d.b.split(",")[0].trim() : null],
  ["class", "Drug → class", d => d.cls],
  ["mech", "Class → mechanism", d => d.moa, d => d.cls],
  ["ind", "Drug → indication", d => firstClause(d.ind)],
  ["ae", "Drug → serious adverse effect", d => firstClause(d.sae)],
  ["anti", "Drug → antidote", d => d.anti && !/^No antidote/.test(d.anti) ? firstClause(d.anti) : null],
  ["lab", "Drug → lab or monitoring", d => firstClause(d.mon)]
];
const GAME = { mode: "anti", pairs: [], left: [], right: [], selL: null, selR: null, done: new Set(), err: 0, start: 0, over: false };
function newGame(mode) {
  const m = GMODES.find(x => x[0] === mode); GAME.mode = mode;
  const L = m[3] || (d => d.g);
  const pool = shuffle(DRUGS.filter(d => m[2](d)));
  const pairs = [], seenR = new Set(), seenL = new Set();
  for (const d of pool) { const r = m[2](d), l = L(d); if (seenR.has(r) || seenL.has(l)) continue; seenR.add(r); seenL.add(l); pairs.push({ id: d.id, l, r }); if (pairs.length === 5) break; }
  Object.assign(GAME, { pairs, left: shuffle(pairs.map(p => p.id)), right: shuffle(pairs.map(p => p.id)), selL: null, selR: null, done: new Set(), err: 0, start: Date.now(), over: false });
}
function vGames(el) {
  if (!GAME.pairs.length) newGame(GAME.mode);
  const P0 = Object.fromEntries(GAME.pairs.map(p => [p.id, p]));
  const secs = Math.round((Date.now() - GAME.start) / 1000);
  el.innerHTML = `<div class="head"><span class="label">Matching games</span><h1>Make the pairs.</h1><p>Pick a tile on the left and its match on the right. Works with mouse, touch, or keyboard (<span class="kbd">Tab</span> to move, <span class="kbd">Enter</span> to choose).</p></div>
   <div class="seg" role="group" aria-label="Game type">${GMODES.map(m => `<button data-mode="${m[0]}" aria-pressed="${GAME.mode === m[0]}">${esc(m[1])}</button>`).join("")}</div>
   <div class="card stack">${GAME.over ? `<div class="fb ok"><h4>${ico("check")} All ${GAME.pairs.length} matched in ${secs}s with ${GAME.err} miss${GAME.err === 1 ? "" : "es"}.</h4><div class="small">Best for this game: ${S.games.best[GAME.mode] != null ? S.games.best[GAME.mode] + " misses" : "—"}</div><div class="row"><button class="btn primary" id="again">New round</button></div></div>` : `<div class="row between small"><span>${GAME.done.size}/${GAME.pairs.length} matched · ${GAME.err} miss${GAME.err === 1 ? "" : "es"}</span><button class="btn sm ghost" id="again">Shuffle new set</button></div>`}
    <div class="match"><div class="col" aria-label="Left column">${GAME.left.map(id => `<button class="tile ${GAME.done.has(id) ? "done" : ""}" data-l="${id}" aria-pressed="${GAME.selL === id}" ${GAME.done.has(id) ? "disabled" : ""}>${esc(P0[id].l)}</button>`).join("")}</div>
    <div class="col" aria-label="Right column">${GAME.right.map(id => `<button class="tile ${GAME.done.has(id) ? "done" : ""}" data-r="${id}" aria-pressed="${GAME.selR === id}" ${GAME.done.has(id) ? "disabled" : ""}>${esc(P0[id].r)}</button>`).join("")}</div></div>
    <div class="small muted" aria-live="polite" id="gmsg"></div></div>${foot()}`;
  el.onclick = e => {
    const b = e.target.closest("button"); if (!b || b.disabled) return;
    if (b.dataset.mode) { newGame(b.dataset.mode); return vGames(el); }
    if (b.id === "again") { newGame(GAME.mode); return vGames(el); }
    if (b.dataset.l) GAME.selL = b.dataset.l; if (b.dataset.r) GAME.selR = b.dataset.r;
    if (GAME.selL && GAME.selR) {
      if (GAME.selL === GAME.selR) { GAME.done.add(GAME.selL); const msg = `Matched: ${P0[GAME.selL].l} → ${P0[GAME.selL].r}`; GAME.selL = GAME.selR = null;
        if (GAME.done.size === GAME.pairs.length) { GAME.over = true; S.games.played++; const b0 = S.games.best[GAME.mode]; S.games.best[GAME.mode] = b0 == null ? GAME.err : Math.min(b0, GAME.err); touch(); save(); }
        vGames(el); $("#gmsg").textContent = msg; return; }
      GAME.err++; const l = GAME.selL, r = GAME.selR; GAME.selL = GAME.selR = null; vGames(el);
      [$(`[data-l="${l}"]`), $(`[data-r="${r}"]`)].forEach(x => x && x.classList.add("shake")); $("#gmsg").textContent = "Not a match — try again."; return;
    }
    vGames(el); const again = $(`[data-${b.dataset.l ? "l" : "r"}="${b.dataset.l || b.dataset.r}"]`); again && again.focus();
  };
}

     <div class="grid g3">${RESCUE.map(r => { const s = S.rescue[r.id]; return `<button class="card stack" style="text-align:left;cursor:pointer" data-r="${r.id}"><div class="row between"><span class="label">${esc(DRUG[r.drug] ? DRUG[r.drug].g : "")}</span>${s ? `<span class="chip ${s.best === 3 ? "badge-S" : "badge-R"}">best ${s.best}/3</span>` : ""}</div><h2 class="h4">${esc(r.title)}</h2></button>`; }).join("")}</div>${foot()}`;
    el.onclick = e => { const b = e.target.closest("[data-r]"); if (b) { Object.assign(RES, { id: b.dataset.r, shown: 1, step: 0, ans: {}, score: 0, o0: null, o1: null, o2: null }); el.onclick = null; vRescue(el); } };
    return;

   ${!allCues ? `<div class="row"><button class="btn" id="more">Reveal next cue</button>${RES.step === 0 ? `<span class="small muted">Or decide now — fewer cues is the real test.</span>` : ""}</div>` : ""}</div>`;

  });

  el.onclick = e => { const b = e.target.closest("[data-q]"); if (!b || b.disabled) return; const qi = +b.dataset.q, oi = +b.dataset.o; RES.ans[qi] = oi; if (oi === qs[qi].k) RES.score++; RES.step = qi + 1;

function startExam(el, items, mode, resumeState) {
  el.onclick = null; el.innerHTML = `<div id="exzone"></div>`;
  const title = resumeState ? resumeState.title : `${items.length}-question ${mode === "exam" ? "exam" : "tutor session"}`;
  Quiz($("#exzone", el), { items, mode, conf: mode === "tutor", title, resumeKey: "exam", resumeState, onDone: r => { S.exams.push({ t: Date.now(), n: r.n, score: r.score, mode, fa: r.fa, fac: r.fac }); S.exams = S.exams.slice(-50); save(); }, again: () => route() });
  window.scrollTo(0, 0);
}
// v2: one item per concept (and at most 2 per drug) so an exam can't reward recognising a repeated scenario;
// "unseen first" is the default and "unseen only" measures comprehension on brand-new items.
function buildExam(n, sys, prefer) {
  const auth = [...QUESTIONS, ...SCEN_Q].filter(q => !sys || sysOf(q).includes(sys));
  const gen = GEN.filter(q => !sys || q.sys.includes(sys));
  const seen = q => !!S.qs[q.id];
  const score = q => prefer === "missed" ? (S.missed[q.id] && !S.missed[q.id].resolved ? 0 : seen(q) ? 2 : 1) : (prefer === "new" || prefer === "unseen") ? (seen(q) ? 1 : 0) : 0;
  const ok = q => prefer !== "unseen" || !seen(q);
  const ord = arr => shuffle(arr.filter(ok)).sort((a, b) => score(a) - score(b));
  const out = [], concepts = new Set(), perDrug = {};
  const add = q => { if (out.length >= n || out.includes(q)) return false; const c = q.concept || q.id; if (concepts.has(c) || (perDrug[q.drug] || 0) >= 2) return false; concepts.add(c); perDrug[q.drug] = (perDrug[q.drug] || 0) + 1; out.push(q); return true; };
  const A = ord(auth), G = ord(gen); let k = 0;
  for (const q of A) { if (out.length >= Math.ceil(n * .75)) break; add(q); }
  for (const q of G) { if (out.length >= n) break; add(q); }
  for (const q of A) { if (out.length >= n) break; add(q); }
  if (out.length < n) for (const q of [...A, ...G]) { if (out.length >= n) break; if (!out.includes(q) && (perDrug[q.drug] || 0) < 3 && !concepts.has(q.concept)) { concepts.add(q.concept); perDrug[q.drug] = (perDrug[q.drug] || 0) + 1; out.push(q); } }
  let r = shuffle(out); for (let i = 1; i < r.length; i++) { if (sysOf(r[i])[0] === sysOf(r[i - 1])[0]) { const j = r.findIndex((q, k) => k > i && sysOf(q)[0] !== sysOf(r[i - 1])[0]); if (j > 0) [r[i], r[j]] = [r[j], r[i]]; } }
  return r;
}

/* ---------- MISSED ---------- */
function vMissed(el) {
  const ents = Object.entries(S.missed).map(([id, m]) => ({ id, m, q: QBYID[id] })).filter(x => x.q).sort((a, b) => (a.m.resolved - b.m.resolved) || a.m.due - b.m.due);
  const open = ents.filter(x => !x.m.resolved), due = open.filter(x => x.m.due <= Date.now());
  const mc = missedConcepts();
  el.innerHTML = `<div class="head"><span class="label">Missed questions &amp; weakness tracker</span><h1>Turn misses into points.</h1><p>Every miss and every correct guess lands here with your answer, the misconception, the rationale and a review date. Concepts missed twice get a shorter explanation, a visual and a new patient scenario.</p></div>
   <div class="grid g3"><div class="card stat"><span class="label">Open items</span><span class="v">${open.length}</span></div><div class="card stat"><span class="label">Due now</span><span class="v">${due.length}</span></div><div class="card stat"><span class="label">Repeat-question accuracy</span><span class="v">${S.rep.att ? pct(S.rep.cor, S.rep.att) + "%" : "—"}</span></div></div>
   ${due.length ? `<div><button class="btn primary" id="revDue">Review ${Math.min(due.length, 15)} due item${due.length > 1 ? "s" : ""}</button></div>` : ""}
   ${mc.length ? `<div class="card stack"><div class="label">Weak concepts</div>${mc.map(c => `<div class="row between"><span>${esc(c.label)}</span><span class="row"><span class="chip badge-flag">${c.n}× missed</span><button class="btn sm" data-alt="${esc(c.k)}">Try it another way</button></span></div>`).join("")}</div>` : ""}
   <div id="mzone"></div>
   <div class="stack">${ents.length ? ents.map(({ id, m, q }) => `<div class="card stack ${m.resolved ? "flat" : ""}"><div class="row between"><div class="row">${sysChips(sysOf(q).slice(0, 2))}${m.guess ? `<span class="chip badge-R">Correct guess</span>` : ""}${m.resolved ? `<span class="chip badge-S">Answered correctly since</span>` : `<span class="chip ${m.due <= Date.now() ? "badge-flag" : ""}">Review ${rel(m.due)}</span>`}</div><span class="small muted">missed ${m.count || 1}× · ${fmtDate(m.when)}</span></div>
     <div>${q.scen ? `<b>${esc(q.scen.title)}:</b> ` : ""}${esc(q.stem)}</div><div class="small"><b>Your answer:</b> ${esc(m.ans || "—")}</div>${m.misc ? `<div class="small"><b>Misconception:</b> ${esc(m.misc)}</div>` : ""}
     <details><summary class="small">Correct answer &amp; rationale</summary><div class="small" style="margin-top:6px"><b>${esc(correctText(q))}</b><br>${esc(q.rat)}</div>${srcHTML(q.src, q.gen)}</details>
     <div class="row"><button class="btn sm" data-retry="${esc(id)}">Retry this question</button></div></div>`).join("") : `<div class="empty">Nothing here yet. Missed questions and lucky guesses appear automatically.</div>`}</div>${foot()}`;
  const zone = $("#mzone");
  el.onclick = e => { const b = e.target.closest("button"); if (!b) return;
    if (b.id === "revDue") { Quiz(zone, { items: due.slice(0, 15).map(x => x.q), mode: "tutor", conf: true, title: "Due review", onDone: () => { vMissed(el); return "custom"; } }); zone.scrollIntoView({ behavior: "smooth" }); }
    if (b.dataset.retry) { Quiz(zone, { items: [QBYID[b.dataset.retry]], mode: "tutor", conf: true, title: "Retry", onDone: () => { vMissed(el); return "custom"; } }); zone.scrollIntoView({ behavior: "smooth" }); }
    if (b.dataset.alt) { const q = ALLQ.find(x => x.concept === b.dataset.alt); if (q) { zone.innerHTML = altHTML(q); const btn = $("[data-act=alt-new]", zone); if (btn) btn.onclick = ev => { ev.stopPropagation(); const nq = altQuestion(q); if (nq) Quiz(zone, { items: [nq], mode: "tutor", conf: true, title: "New scenario", onDone: () => { vMissed(el); return "custom"; } }); }; zone.scrollIntoView({ behavior: "smooth" }); } }
  };
}

/* ---------- COMPARE ---------- */
let CMP = "anticoag";
function compareTable(c) { return `<div class="tbl" tabindex="0" role="region" aria-label="${esc(c.t)} comparison table"><table><thead><tr><th scope="col"><span class="sr">Feature</span></th>${c.cols.map(x => `<th scope="col">${esc(x)}</th>`).join("")}</tr></thead><tbody>${c.rows.map(r => `<tr><th scope="row">${esc(r[0])}</th>${r.slice(1).map(v => `<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`; }
function vCompare(el) {
  const c = COMPARE.find(x => x.id === CMP);
  el.innerHTML = `<div class="head"><span class="label">Compare medications</span><h1>Tell the look-alikes apart.</h1><p>Side by side on the differences that change what you do at the bedside.</p></div>
   ${sel("cmpSel", "Comparison", COMPARE.map(x => [x.id, x.t]), CMP)}
   <div class="card stack"><h2>${esc(c.t)}</h2>${compareTable(c)}<div class="panel"><b>The difference that matters:</b> ${esc(c.point)}</div>${c.flag ? `<div class="flagbox">Insulin timing numbers are flagged: your Med-Surg slide and standard references disagree on NPH onset and duration. Check the flag in the library.</div>` : ""}<div class="small muted">† = supplementary reference content.</div></div>${foot()}`;
  $("#cmpSel").onchange = e => { CMP = e.target.value; vCompare(el); };
}

/* ---------- PROGRESS ---------- */
function vProgress(el) {
  const lv = Object.fromEntries(LEVELS.map(l => [l, 0])); DRUGS.forEach(d => lv[drugLevel(d)]++);
  const fa = firstAcc(400);
  el.innerHTML = `<div class="head"><span class="label">Progress &amp; data</span><h1>Your record.</h1><p>${cloud.ref ? "Progress saves to your account automatically and on this device." : "Progress saves on this device. Export a backup to move it elsewhere."}</p></div>
   ${(() => { const w = weakTags().slice(0, 5); return `<div class="card stack"><div class="row between"><div class="label">My pharm weak areas</div><a class="btn sm" href="#review/weak">Practice</a></div>${w.length ? w.map(x => `<div class="row between small"><span>${esc(TAGN[x.g] || x.g)}</span><span class="mono">${Math.round(x.acc * 100)}% · ${x.x.seen}/${x.x.n} seen</span></div>`).join("") : `<div class="small muted">Answer questions in Pharm HESI Review to see topic-level weak areas.</div>`}${(lqS().mock || []).length ? `<div class="xs muted">Last mock: ${lqS().mock.slice(-1)[0].score}% · ${lqS().mock.length} attempt${lqS().mock.length > 1 ? "s" : ""} kept</div>` : ""}</div>`; })()}
   ${(() => { const R = readiness(), mo = mmOverall(), ov = Math.round(0.7 * R.score + 0.3 * mo), st = sysStats().filter(x => x.score != null).sort((a, b) => a.score - b.score);
     const bar = (n, v, sub) => `<div class="stack"><div class="row between"><b>${n}</b><span class="mono">${v}%</span></div><div class="bar ${v >= 80 ? "ok" : ""}"><i style="width:${v}%"></i></div><span class="xs muted">${sub}</span></div>`;
     return `<div class="card stack"><div class="label">Readiness · one number, two parts</div><div class="grid g3">${bar("Overall", ov, "70% pharmacology + 30% med math · goal 80%")}${bar("Pharmacology", R.score, `First-attempt accuracy ${R.fa.n ? Math.round(R.fa.p * 100) + "%" : "—"} (60%) · P1 drugs at Reviewing+ ${Math.round(R.cov * 100)}% (25%) · clinical application ${R.apn ? Math.round(R.app * 100) + "%" : "—"} (15%)`)}${bar("Med math", mo, "Average mastery across foundation skills")}</div>
      ${st.length ? `<details><summary class="small"><b>By body system</b> (weakest first)</summary><div class="stack" style="margin-top:8px">${st.map(x => sysRow(x, x.score >= .8 ? "ok" : "bad")).join("")}</div></details>` : ""}</div>`; })()}
   <div class="card stack"><div class="label">Drug mastery (${DRUGS.length} drugs)</div>${LEVELS.map(l => `<div class="sysrow"><span><span class="lvl lvl-${l}">${l}</span></span><div class="bar"><i style="width:${pct(lv[l], DRUGS.length)}%"></i></div><span class="mono">${lv[l]}</span></div>`).join("")}</div>
   <div class="grid g4"><div class="card stat"><span class="label">First-attempt accuracy</span><span class="v">${fa.n ? Math.round(fa.p * 100) + "%" : "—"}</span><span class="small muted">${fa.c}/${fa.n}</span></div><div class="card stat"><span class="label">Repeat accuracy</span><span class="v">${S.rep.att ? pct(S.rep.cor, S.rep.att) + "%" : "—"}</span></div><div class="card stat"><span class="label">Sessions</span><span class="v">${S.sessions.length}</span></div><div class="card stat"><span class="label">Matching games</span><span class="v">${S.games.played}</span></div></div>
   <div class="card stack"><div class="label">Settings</div><div class="grid g2"><div class="field"><label for="tgt">Daily study target (minutes)</label><select id="tgt">${[10, 20, 30, 45, 60].map(m => `<option ${S.target === m ? "selected" : ""}>${m}</option>`).join("")}</select></div><div class="field"><label for="exd">Exam date</label><input type="date" id="exd" value="${esc(S.examDate)}"></div></div></div>
   <div class="card stack"><div class="label">Bookmarked &amp; flagged drugs</div>${[...new Set([...S.bookmarks, ...S.flags])].length ? `<div class="row">${[...new Set([...S.bookmarks, ...S.flags])].map(id => DRUG[id] ? `<button class="btn sm" data-nav="library" data-arg="${id}">${esc(DRUG[id].g)}${S.flags.includes(id) ? " ⚑" : ""}</button>` : "").join("")}</div>` : `<div class="small muted">Use Bookmark or Flag on any drug's deep dive.</div>`}</div>
   <div class="card stack"><div class="label">Your explanations</div>${S.journal.length ? S.journal.slice(-6).reverse().map(j => `<div class="panel small"><b>${esc(DRUG[j.drug] ? DRUG[j.drug].g : "")}</b> · ${fmtDate(j.t)}<br>${esc(j.txt)}</div>`).join("") : `<div class="small muted">Self-explanations from sessions and deep dives appear here.</div>`}</div>
   <div class="card stack"><div class="label">Backup</div><p class="small muted">Export saves a JSON file of your progress. Import replaces current progress with a file or pasted JSON.</p>
    <div class="row"><button class="btn" id="exp">Export progress (.json)</button><button class="btn" id="cpy">Copy progress JSON</button><label class="btn" for="impf">Import from file</label><input type="file" id="impf" accept="application/json,.json" hidden></div>
    <div class="field"><label for="impt">Or paste JSON to import</label><textarea id="impt" rows="3" placeholder='{"v":1, ...}'></textarea></div><div class="row"><button class="btn" id="impgo">Import pasted JSON</button><button class="btn danger" id="reset">Reset all progress</button></div><div class="stack"><span class="label">Automatic safety copies (this device)</span><div id="bkz" class="stack"></div></div><div id="pmsg" class="small" aria-live="polite"></div></div>${foot()}`;
  $("#tgt").onchange = e => { S.target = +e.target.value; save(); toast("Daily target updated"); };
  $("#exd").onchange = e => { S.examDate = e.target.value; save(); toast("Exam date saved"); };
  const msg = t => $("#pmsg").textContent = t;
  $("#exp").onclick = async () => { const data = JSON.stringify(S, null, 1); try { const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; if (dl) { const r = await dl.save({ filename: `pharm-master-progress-${dstr()}.json`, data }); msg(r === "saved" || (r && r.status === "saved") ? "Export saved." : "Export sent to your device's save dialog."); return; } } catch (e) { if (e && e.code === "declined") return msg("Export canceled."); }
    $("#impt").value = data; $("#impt").select(); msg("Downloads aren't available here — your progress JSON is in the box above. Copy it and keep it somewhere safe."); };
  $("#cpy").onclick = async () => { const data = JSON.stringify(S); try { await navigator.clipboard.writeText(data); msg("Copied progress JSON to the clipboard."); } catch (e) { $("#impt").value = data; $("#impt").select(); msg("Clipboard blocked — the JSON is selected in the box; copy it manually."); } };
  const doImport = txt => { try { const o = JSON.parse(txt); if (!o || typeof o !== "object" || o.v !== 1 || !o.cards) throw new Error("This doesn't look like a PHARM MASTER progress file."); backupProgress("before import"); S = migrate(o); S.updatedAt = Date.now(); save(); flush(true); toast("Progress imported — your previous progress was backed up first"); route(); } catch (e) { msg("Import failed: " + e.message + " Check that you pasted the whole export."); } };
  $("#impgo").onclick = () => doImport($("#impt").value.trim());
  $("#impf").onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => doImport(String(r.result)); r.onerror = () => msg("Couldn't read that file."); r.readAsText(f); };
  const bl = listBackups(), bz = $("#bkz"); if (bz) { bz.innerHTML = bl.length ? bl.map((b, i) => `<div class="row between small"><span>${fmtDate(b.at)} · ${esc(b.reason)}</span><button class="btn sm" data-bk="${i}">Restore</button></div>`).join("") : `<div class="small muted">No automatic safety copies yet. One is made before every import or reset.</div>`;
    bz.onclick = e => { const b = e.target.closest("[data-bk]"); if (!b) return; confirmInline(bz, "Restore this safety copy? Your current progress is backed up first.", () => { const c = bl[+b.dataset.bk]; backupProgress("before restore"); S = migrate(JSON.parse(c.json)); S.updatedAt = Date.now(); save(); flush(true); toast("Safety copy restored"); route(); }); }; }
  $("#reset").onclick = () => confirmInline(el, "Erase all progress, cards and history? This can't be undone unless you exported a backup.", () => { backupProgress("before reset"); const keep = { examDate: S.examDate, target: S.target }; S = Object.assign(DEF(), keep); S.updatedAt = Date.now(); save(); flush(true); toast("Progress reset — a safety copy was kept on this device"); route(); });
}

/* ---------- boot ---------- */
shell();
window.addEventListener("hashchange", () => { NAV_DEPTH++; route(); });
route();
setSync(false);
initCloud();
window.addEventListener("error", e => { console.error(e.error || e.message); });

</script>
